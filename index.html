<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>منصة السادات | English Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070b15;--bg2:#0b1120;--surface:rgba(255,255,255,.04);--surface2:rgba(255,255,255,.07);--border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.16);--text:#e8ecf6;--muted:#8b93a8;--primary:#8b5cf6;--accent:#22d3ee;--success:#34d399;--warning:#fbbf24;--danger:#f87171;--grad:linear-gradient(135deg,#8b5cf6 0%,#6366f1 50%,#22d3ee 100%);--glow:0 0 25px rgba(139,92,246,.35);--shadow:0 8px 30px rgba(0,0,0,.45);--r:14px;--r-lg:22px;--side:270px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:#2a3350;border-radius:10px}
.muted{color:var(--muted);font-size:11px}
.gradient-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bg-glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;opacity:.5}
.glow-1{width:520px;height:520px;background:rgba(139,92,246,.22);top:-160px;right:-120px;animation:drift 14s ease-in-out infinite}
.glow-2{width:460px;height:460px;background:rgba(34,211,238,.14);bottom:-160px;left:-120px;animation:drift 18s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-40px)}}
.screen{display:none;min-height:100vh;position:relative;z-index:1}
.screen.active{display:block}
#loginScreen.active{display:flex;align-items:center;justify-content:center;padding:20px;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px}
.login-container{background:rgba(13,18,35,.75);backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:var(--r-lg);padding:42px 36px;width:100%;max-width:440px;box-shadow:var(--shadow);animation:up .5s ease}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.login-header{text-align:center;margin-bottom:28px}
.logo-circle{width:86px;height:86px;background:var(--grad);border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 16px;box-shadow:var(--glow)}
.login-header h1{font-size:30px;font-weight:900}
.school-name{font-weight:800;margin-top:6px;font-size:15px}
.subtitle{color:var(--muted);font-size:13px;margin-top:2px}
.login-note{margin-top:18px;text-align:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--border2);padding:10px;border-radius:10px}
.form{display:none}.form.active{display:block}
.input-group{margin-bottom:16px}
.input-group label{display:block;margin-bottom:6px;font-weight:700;font-size:13px;color:#c3cadd}
.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px 15px;background:rgba(255,255,255,.05);border:1.5px solid var(--border);border-radius:11px;color:var(--text);font-family:inherit;font-size:15px;min-height:48px}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,92,246,.18);background:rgba(139,92,246,.06)}
.input-group select option{background:var(--bg2);color:var(--text)}
.btn-primary{width:100%;padding:14px;background:var(--grad);color:#fff;border:none;border-radius:11px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;min-height:48px}
.btn-primary:hover{transform:translateY(-2px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.error-msg{color:var(--danger);font-size:13px;margin-top:12px;text-align:center;min-height:20px;font-weight:600}
#appScreen.active{display:flex}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:90}
.overlay.show{display:block}
.sidebar{width:var(--side);background:rgba(10,14,28,.95);backdrop-filter:blur(20px);border-left:1px solid var(--border);height:100vh;position:fixed;right:0;top:0;display:flex;flex-direction:column;transition:transform .3s;z-index:100}
.sidebar-header{padding:22px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.logo-small{width:46px;height:46px;background:var(--grad);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.sidebar-header h2{font-size:17px;font-weight:900}
.sidebar-nav{flex:1;padding:14px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:11px;color:#aab2c8;cursor:pointer;margin-bottom:4px;font-weight:700;font-size:14px;border:1px solid transparent}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(34,211,238,.12));color:#fff;border-color:rgba(139,92,246,.45)}
.nav-item .icon{font-size:20px}
.sidebar-footer{padding:16px;border-top:1px solid var(--border)}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.user-avatar{width:44px;height:44px;background:var(--grad);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.user-name{font-weight:800;font-size:14px}
.user-role{font-size:12px;color:var(--accent);font-weight:700}
.btn-ghost,.btn-logout{width:100%;padding:10px;border-radius:9px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:8px;min-height:44px;border:1px solid}
.btn-ghost{background:var(--surface);border-color:var(--border);color:#aab2c8}
.btn-logout{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:var(--danger)}
.main-content{flex:1;margin-right:var(--side);min-height:100vh;display:flex;flex-direction:column}
.topbar{background:rgba(10,14,28,.85);backdrop-filter:blur(16px);padding:14px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.menu-toggle{display:none;background:none;border:none;font-size:26px;cursor:pointer;color:var(--text)}
.page-title{font-size:19px;font-weight:900;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.points-badge{background:var(--grad);color:#fff;padding:8px 16px;border-radius:20px;font-weight:900;display:flex;align-items:center;gap:6px;font-size:14px}
.content-area{padding:24px;flex:1}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:24px}
.stat-card,.card,.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;transition:.3s}
.stat-card:hover,.item-card:hover{transform:translateY(-4px);border-color:rgba(139,92,246,.5)}
.stat-icon{width:48px;height:48px;background:var(--grad);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;margin-bottom:12px}
.stat-value{font-size:28px;font-weight:900}
.stat-label{color:var(--muted);font-size:13px;font-weight:700}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.card-title{font-size:17px;font-weight:900}
.item-card h3{font-size:15.5px;font-weight:800;margin-bottom:6px}
.item-card p{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:12px}
.item-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.badge{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:4px;border:1px solid}
.badge-primary{background:rgba(139,92,246,.14);color:#c4b5fd;border-color:rgba(139,92,246,.35)}
.badge-success{background:rgba(52,211,153,.12);color:#6ee7b7;border-color:rgba(52,211,153,.35)}
.badge-warning{background:rgba(251,191,36,.12);color:#fcd34d;border-color:rgba(251,191,36,.35)}
.badge-danger{background:rgba(248,113,113,.12);color:#fca5a5;border-color:rgba(248,113,113,.35)}
.badge-info{background:rgba(34,211,238,.12);color:#67e8f9;border-color:rgba(34,211,238,.35)}
.btn{padding:8px 16px;border:none;border-radius:9px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;text-decoration:none}
.btn-sm{padding:6px 12px;font-size:12px;min-height:36px}
.btn-primary-solid{background:var(--grad);color:#fff}
.btn-success{background:rgba(52,211,153,.15);color:#6ee7b7;border:1px solid rgba(52,211,153,.4)}
.btn-danger{background:rgba(248,113,113,.13);color:#fca5a5;border:1px solid rgba(248,113,113,.4)}
.btn-warning{background:rgba(251,191,36,.13);color:#fcd34d;border:1px solid rgba(251,191,36,.4)}
.btn-outline{background:transparent;border:1.5px solid var(--border2);color:#aab2c8}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.leaderboard-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px}
.leaderboard-item.top-1{background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(251,191,36,.04));border-color:rgba(251,191,36,.5)}
.rank{width:42px;height:42px;background:var(--grad);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.leaderboard-info{flex:1;min-width:0}
.leaderboard-name{font-weight:800;font-size:14px}
.leaderboard-points{font-weight:900;color:var(--accent);font-size:17px;flex-shrink:0}
.modal{display:none;position:fixed;inset:0;background:rgba(3,6,14,.8);backdrop-filter:blur(8px);z-index:1000;align-items:center;justify-content:center;padding:18px}
.modal.active{display:flex}
.modal-content{background:#0d1326;border:1px solid var(--border2);border-radius:var(--r-lg);max-width:620px;width:100%;max-height:90vh;overflow-y:auto;position:relative;animation:up .3s}
.modal-close{position:absolute;top:14px;left:14px;width:36px;height:36px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.modal-body{padding:30px}
.toast-container{position:fixed;top:18px;left:18px;z-index:2000;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:#0d1326;border:1px solid var(--border2);padding:14px 18px;border-radius:11px;box-shadow:var(--shadow);min-width:270px;border-right:4px solid var(--primary);animation:slideIn .3s;font-weight:700;font-size:13.5px;pointer-events:auto}
.toast.success{border-right-color:var(--success)}
.toast.error{border-right-color:var(--danger)}
@keyframes slideIn{from{transform:translateX(-110%);opacity:0}to{transform:translateX(0);opacity:1}}
.quiz-question{background:var(--surface);border:1px solid var(--border);padding:18px;border-radius:var(--r);margin-bottom:14px}
.quiz-options{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.quiz-option{padding:12px 15px;background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;text-align:right;color:var(--text);min-height:44px;display:flex;align-items:center}
.quiz-option.selected{border-color:var(--primary);background:rgba(139,92,246,.16)}
.quiz-option.correct{border-color:var(--success);background:rgba(52,211,153,.14)}
.quiz-option.wrong{border-color:var(--danger);background:rgba(248,113,113,.13)}
.quiz-explanation{background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.3);padding:11px;border-radius:9px;margin-top:10px;font-size:12.5px;color:#a5f3fc;display:none}
.quiz-explanation.show{display:block}
.announcement-card{background:var(--surface);border:1px solid var(--border);border-right:4px solid var(--primary);border-radius:var(--r);padding:18px;margin-bottom:13px}
.announcement-card.urgent{border-right-color:var(--danger)}
.announcement-header{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.announcement-title{font-weight:800;font-size:15px}
.announcement-date{color:var(--muted);font-size:11.5px}
.announcement-content{color:#b8c0d4;line-height:1.8;font-size:13.5px}
.loader{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.25);border-radius:50%;border-top-color:#fff;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state .icon{font-size:56px;margin-bottom:14px;opacity:.5}
.table-wrapper{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--border);font-size:13px}
th{background:rgba(255,255,255,.04);font-weight:800;color:#aab2c8;font-size:12px;white-space:nowrap}
.dynamic-q-box{background:rgba(255,255,255,0.03);padding:15px;border-radius:10px;margin-bottom:15px;border:1px dashed var(--border)}
.remove-q-btn{background:rgba(248,113,113,0.2);color:#fca5a5;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;margin-top:10px}
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.badge-card{background:var(--surface);border:1px solid var(--border);padding:20px;border-radius:var(--r);text-align:center;transition:.3s;position:relative;overflow:hidden}
.badge-card:hover{transform:translateY(-5px);border-color:rgba(139,92,246,.5);box-shadow:0 12px 35px rgba(139,92,246,.2)}
.badge-card.earned{background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(34,211,238,.1));border-color:rgba(139,92,246,.6);box-shadow:0 0 25px rgba(139,92,246,.15)}
.badge-icon{font-size:42px;margin-bottom:10px;filter:drop-shadow(0 4px 8px rgba(139,92,246,.3))}
.badge-name{font-weight:800;font-size:14px;margin-bottom:4px}
.badge-points{font-size:12px;color:var(--muted)}
.badge-qty{background:var(--grad);color:#fff;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:900;display:inline-block;margin-top:8px}
.footer{text-align:center;padding:20px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:40px}
.ticket-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px;border-right:4px solid var(--primary)}
.ticket-card.status-open{border-right-color:var(--warning)}
.ticket-card.status-closed{border-right-color:var(--success);opacity:.85}
.ticket-body{color:#b8c0d4;line-height:1.8;font-size:13.5px;padding:12px;background:rgba(255,255,255,.02);border-radius:8px;margin:10px 0}
.ticket-reply{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);padding:12px;border-radius:8px;margin-top:10px}
.ticket-reply strong{color:var(--success)}
@media (max-width:900px){.sidebar{transform:translateX(100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-right:0}.menu-toggle{display:block}.content-area{padding:16px}.stats-grid,.badges-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}table{min-width:600px}}
@media (max-width:600px){.login-container{padding:30px 20px}.stats-grid,.badges-grid{grid-template-columns:1fr}.btn-group{flex-direction:column}.btn-group .btn{width:100%}.modal-content{width:95%;max-height:95vh}.modal-body{padding:20px 16px}.topbar{padding:12px 16px}.page-title{font-size:16px}.points-badge{padding:6px 12px;font-size:13px}.table-wrapper{margin:-10px;border-radius:0}table{min-width:100%;font-size:11px}th,td{padding:8px 6px}td .btn-group{flex-direction:column;gap:4px}td .btn{padding:4px 8px;font-size:10px;min-height:28px;width:100%}.input-group input,.input-group select,.input-group textarea{font-size:14px;padding:10px 12px;min-height:44px}}
</style>
</head>
<body>
<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>

<div id="loginScreen" class="screen active">
  <div class="login-container">
    <div class="login-header">
      <div class="logo-circle"><span>🎓</span></div>
      <h1 class="gradient-text">English Hub</h1>
      <p class="school-name">مدرسة السادات الثانوية بنين</p>
      <p class="subtitle">المحلة الكبرى</p>
    </div>
    <form id="loginForm" class="form active">
      <div class="input-group"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" required placeholder="example@sadat.edu"/></div>
      <div class="input-group"><label>كلمة المرور</label><input type="password" id="loginPassword" required placeholder="••••••••"/></div>
      <button type="submit" id="loginBtn" class="btn-primary">دخول 🚀</button>
      <p id="loginError" class="error-msg"></p>
    </form>
    <div class="login-note">🔐 الحسابات يتم إنشاؤها بواسطة الإدارة فقط</div>
  </div>
</div>

<div id="appScreen" class="screen">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-small">🎓</div>
      <div><h2 class="gradient-text">English Hub</h2><small class="muted">السادات الثانوية بنين</small></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-details"><div class="user-name" id="userName">...</div><div class="user-role" id="userRole">...</div></div>
      </div>
      <button class="btn-ghost" id="changePassBtn">🔑 تغيير كلمة المرور</button>
      <button class="btn-logout" id="logoutBtn">تسجيل الخروج 🚪</button>
    </div>
  </aside>
  <main class="main-content">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <h2 class="page-title" id="pageTitle">الرئيسية</h2>
      <div class="points-badge"><span>⭐</span><span id="userPoints">0</span></div>
    </header>
    <div class="content-area" id="contentArea"></div>
    <div class="footer">تطوير: <strong>فاروق امجد فاروق المليجي</strong> | منصة تعليم اللغة الإنجليزية - مدرسة السادات الثانوية بنين</div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://zhvcliqqsvvobhynzmvx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_FP7G3btTd-TupPNdODp2oA_Il0UhtPu';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null, currentProfile = null;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function toast(msg, type='info'){
  const t=document.createElement('div'); t.className=`toast ${type}`; t.textContent=msg;
  $('#toastContainer').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},3500);
}
function openModal(html){ $('#modalBody').innerHTML=html; $('#modal').classList.add('active'); $('#modalClose').style.display='flex'; }
function closeModal(){ $('#modal').classList.remove('active'); }
$('#modalClose').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

function escapeHtml(s){ if(s==null)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function formatDate(d){ if(!d)return''; try{return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return d} }
function toLocalInput(d){ if(!d)return''; const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,16); }

$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=$('#loginBtn'), err=$('#loginError');
  err.textContent=''; btn.disabled=true; btn.innerHTML='<span class="loader"></span> جاري الدخول...';
  try{
    const { error } = await sb.auth.signInWithPassword({ email: $('#loginEmail').value.trim().toLowerCase(), password: $('#loginPassword').value });
    if(error){ err.textContent = error.message.includes('Invalid') ? '❌ البريد أو كلمة المرور غير صحيحة' : '❌ ' + error.message; return; }

async function loadUser(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;
  currentUser = user;
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if(error){ await sb.auth.signOut(); $('#loginError').textContent = '⚠️ جداول قاعدة البيانات غير جاهزة'; return; }
  let p = profile;
  if(!p){
    const meta = user.user_metadata || {};
    const { data: np } = await sb.from('profiles').insert({ id:user.id, email:user.email, full_name:meta.full_name||user.email.split('@')[0], role:meta.role||'student' }).select().single();
    p = np;
  }
  currentProfile = p;
  showApp();
}

async function recalculatePoints(userId){
  const { data: userBadges } = await sb.from('user_badges').select('quantity, badges(points)').eq('user_id', userId);
  const totalPoints = (userBadges || []).reduce((sum, ub) => sum + ((ub.badges?.points || 0) * (ub.quantity || 1)), 0);
  await sb.from('profiles').update({ points: totalPoints }).eq('id', userId);
  if(userId === currentProfile.id){ currentProfile.points = totalPoints; $('#userPoints').textContent = totalPoints; }
  return totalPoints;
}

async function checkAndAwardAutoBadges(userId, type){
  const { data: autoBadges } = await sb.from('badges').select('*').in('name', ['مستكشف','متفوق','ممتحن','مجتهد']);
  const badgeMap = {};
  (autoBadges || []).forEach(b => badgeMap[b.name] = b.id);
  const names = {material_view:'مستكشف',assignment_pass:'متفوق',exam_complete:'ممتحن',project_submit:'مجتهد'};
  const icons = {material_view:'🔍',assignment_pass:'🌟',exam_complete:'📝',project_submit:'💪'};
  const badgeName = names[type];
  if(!badgeName || !badgeMap[badgeName]) return;
  const { data: existing } = await sb.from('user_badges').select('*').eq('user_id', userId).eq('badge_id', badgeMap[badgeName]).maybeSingle();
  if(existing){
    await sb.from('user_badges').update({ quantity: (existing.quantity || 0) + 1 }).eq('id', existing.id);
  } else {
    await sb.from('user_badges').insert({ user_id: userId, badge_id: badgeMap[badgeName], quantity: 1 });
  }
  await recalculatePoints(userId);
  if(userId === currentProfile.id) toast(`🎉 حصلت على وسام "${badgeName} ${icons[type]}"!`, 'success');
}

async function editBadge(badgeId){
  const { data: badge, error } = await sb.from('badges').select('*').eq('id', badgeId).single();
  if(error || !badge){ toast('❌ لم يتم العثور على الوسام', 'error'); return; }
  
  openModal(`<h2>✏️ تعديل الوسام</h2><form id="editBadgeForm">
    <div class="input-group"><label>اسم الوسام</label><input type="text" id="editBadgeName" value="${escapeHtml(badge.name)}" required/></div>
    <div class="input-group"><label>الأيقونة (Emoji)</label><input type="text" id="editBadgeIcon" value="${escapeHtml(badge.icon || '🏅')}" style="font-size:24px;text-align:center"/></div>
    <div class="input-group"><label>عدد النقاط</label><input type="number" id="editBadgePoints" value="${badge.points || 0}" min="0" max="1000" required style="font-size:18px;text-align:center"/></div>
    <div class="input-group"><label>الوصف (اختياري)</label><textarea id="editBadgeDesc" rows="3">${escapeHtml(badge.description || '')}</textarea></div>
    <button type="submit" class="btn-primary">💾 حفظ التعديلات</button></form>`);
  
  $('#editBadgeForm').addEventListener('submit', async e => {
    e.preventDefault();
    
    const { error } = await sb.from('badges').update({
      name: $('#editBadgeName').value.trim(),
      icon: $('#editBadgeIcon').value.trim() || '🏅',
      points: parseInt($('#editBadgePoints').value) || 0,
      description: $('#editBadgeDesc').value.trim()
    }).eq('id', badgeId);
    
    if(error){ toast('❌ ' + error.message, 'error'); return; }
    
    // update points for students with this badge
    const { data: affectedUsers } = await sb.from('user_badges')
      .select('user_id')
      .eq('badge_id', badgeId);
    
    if(affectedUsers && affectedUsers.length > 0){
      const uniqueUsers = [...new Set(affectedUsers.map(u => u.user_id))];
      for(const userId of uniqueUsers){
        await recalculatePoints(userId);
      }
    }
    
    toast('✅ تم التعديل', 'success');
    closeModal();
    renderBadges();
  });
}

async function renderLessons(){
  const area=$('#contentArea');
  area.innerHTML='<div class="empty-state"><span class="loader"></span></div>';
  const { data: lessons } = await sb.from('lessons').select('*, profiles(full_name)').order('start_time',{ascending:true});

async function lessonCard(l,admin){
  const now = new Date();
  const start = l.start_time ? new Date(l.start_time) : null;
  const end = l.end_time ? new Date(l.end_time) : null;
  let status = 'upcoming', statusClass = 'badge-info', statusText = 'قادمة';
  if(start && now >= start && (!end || now <= end)){ status = 'live'; statusClass = 'badge-danger'; statusText = 'مباشر 🔴'; }
  else if(end && now > end){ status = 'completed'; statusClass = 'badge-success'; statusText = 'انتهت'; }
  
  // get the student's attendance when the lesson is over
  let studentAttendanceHTML = '';
  if(!admin && status === 'completed'){
    const { data: att } = await sb.from('attendance')
      .select('status')
      .eq('lesson_id', l.id)
      .eq('user_id', currentProfile.id)
      .maybeSingle();
    
    if(att){
      const statusMap = {
        present: { text: '✅ حاضر', class: 'badge-success' },
        absent: { text: '❌ غائب', class: 'badge-danger' }
      };
      const s = statusMap[att.status] || statusMap.absent;
      studentAttendanceHTML = `<div class="item-meta"><span class="badge ${s.class}" style="font-size:12px;padding:6px 12px">حالتك: ${s.text}</span></div>`;
    }
  }
  
  // show the join button only for live lessons
  const joinBtn = (status === 'live' && l.lesson_link) 
    ? `<a href="${escapeHtml(l.lesson_link)}" target="_blank" class="btn btn-success btn-sm" style="margin-bottom:10px; width:100%">🔗 دخول الحصة الآن</a>`
    : (status === 'upcoming' && l.lesson_link 
        ? `<div class="btn btn-outline btn-sm" style="margin-bottom:10px; width:100%; opacity:.5; cursor:not-allowed">🔒 الحصة لم تبدأ بعد</div>`
        : (status === 'completed' && l.lesson_link
            ? `<div class="btn btn-outline btn-sm" style="margin-bottom:10px; width:100%; opacity:.5; cursor:not-allowed">🔒 الحصة انتهت</div>`
            : ''));
  
  return `<div class="item-card"><div class="item-card-header"><span class="badge ${statusClass}">${statusText}</span></div>
    <h3>${escapeHtml(l.title)}</h3><p>${escapeHtml(l.description||'')}</p>
    <div class="item-meta"><span class="badge badge-info">🕐 ${l.start_time?formatDate(l.start_time):'غير محدد'}</span></div>
    ${joinBtn}
    ${studentAttendanceHTML}
    <div class="btn-group">${admin
      ?`<button class="btn btn-sm btn-warning" data-action="edit-lesson" data-id="${l.id}">✏️</button><button class="btn btn-sm btn-danger" data-action="delete-lesson" data-id="${l.id}">🗑️</button>`
      :''}</div></div>`;
}

async function loadAttendanceForLesson(lessonId, students){
  const { data: existingAttendance } = await sb.from('attendance')
    .select('*')
    .eq('lesson_id', lessonId);
  
  const attendanceMap = {};
  (existingAttendance || []).forEach(a => {
    attendanceMap[a.user_id] = a.status;
  });
  
  const content = `
    <div style="margin-top:20px">
      <div style="background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);padding:12px;border-radius:10px;margin-bottom:15px;font-size:13px;color:#6ee7b7">
        💡 <strong>طريقة التسجيل:</strong> كل طالب عنده 3 نقاط حضور. لو اتشيك على نقطتين أو 3 = <span style="color:var(--success)">حاضر ✅</span>، لو نقطة واحدة أو 0 = <span style="color:var(--danger)">غائب ❌</span>
      </div>
      
      <div style="display:flex;flex-direction:column;gap:10px;max-height:500px;overflow-y:auto">
        ${students.map(s => {
          const currentStatus = attendanceMap[s.id] || 'absent';
          // check the current attendance status
          let check1 = false, check2 = false, check3 = false;
          if(currentStatus === 'present'){ check1 = true; check2 = true; check3 = true; }
          
          return `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px" data-student-row="${s.id}">
              <div style="flex:1">
                <div style="font-weight:700;font-size:14px">${escapeHtml(s.full_name)}</div>
                <div style="font-size:11px;color:var(--muted)">${escapeHtml(s.email || '')}</div>
              </div>
              <div style="display:flex;align-items:center;gap:15px">
                <div style="display:flex;gap:8px;align-items:center">
                  <label style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:10px;color:var(--muted)">
                    <input type="checkbox" class="attendance-check" data-student="${s.id}" data-check="1" ${check1 ? 'checked' : ''} style="width:20px;height:20px;cursor:pointer;accent-color:var(--success)"/>
                    <span>1</span>
                  </label>
                  <label style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:10px;color:var(--muted)">
                    <input type="checkbox" class="attendance-check" data-student="${s.id}" data-check="2" ${check2 ? 'checked' : ''} style="width:20px;height:20px;cursor:pointer;accent-color:var(--success)"/>
                    <span>2</span>
                  </label>
                  <label style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:10px;color:var(--muted)">
                    <input type="checkbox" class="attendance-check" data-student="${s.id}" data-check="3" ${check3 ? 'checked' : ''} style="width:20px;height:20px;cursor:pointer;accent-color:var(--success)"/>
                    <span>3</span>
                  </label>
                </div>
                <span class="attendance-status-badge badge ${currentStatus === 'present' ? 'badge-success' : 'badge-danger'}" data-student-status="${s.id}">
                  ${currentStatus === 'present' ? '✅ حاضر' : '❌ غائب'}
                </span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
      
      <button class="btn btn-primary" id="saveAttendanceBtn" style="margin-top:20px;width:100%">💾 حفظ الحضور</button>
    </div>
  `;
  
  $('#attendanceContent').innerHTML = content;
  
  // update the status when a checkbox changes
  $$('.attendance-check').forEach(cb => {
    cb.addEventListener('change', () => {
      const studentId = cb.dataset.student;
      const checks = $$(`.attendance-check[data-student="${studentId}"]`);
      const checkedCount = Array.from(checks).filter(c => c.checked).length;
      
      const badge = $(`[data-student-status="${studentId}"]`);
      if(checkedCount >= 2){
        badge.className = 'attendance-status-badge badge badge-success';
        badge.textContent = '✅ حاضر';
      } else {
        badge.className = 'attendance-status-badge badge badge-danger';
        badge.textContent = '❌ غائب';
      }
    });
  });
  
  // save attendance
  $('#saveAttendanceBtn').addEventListener('click', async () => {
    const btn = $('#saveAttendanceBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loader"></span> جاري الحفظ...';
    
    try {
      const studentsData = {};
      
      // collect attendance for each student
      $$('.attendance-check').forEach(cb => {
        const studentId = cb.dataset.student;
        if(!studentsData[studentId]) studentsData[studentId] = 0;
        if(cb.checked) studentsData[studentId]++;
      });
      
      // save attendance for each student
      for(const [studentId, checkCount] of Object.entries(studentsData)){
        const status = checkCount >= 2 ? 'present' : 'absent';
        
        await sb.from('attendance').upsert({
          lesson_id: parseInt($('#attendanceLessonSelect').value),
          user_id: studentId,
          status: status
        }, { onConflict: 'user_id,lesson_id' });
      }
      
      toast('✅ تم حفظ الحضور بنجاح', 'success');
    } catch(err) {
      toast('❌ ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '💾 حفظ الحضور';
    }
  });
}

async function trackMaterialView(materialId){
  if(currentProfile.role !== 'student') return;
  
  try {
    const { data: existing } = await sb.from('material_views')
      .select('id')
      .eq('user_id', currentProfile.id)
      .eq('material_id', materialId)
      .maybeSingle();
    
    if(!existing){
      await sb.from('material_views').insert({ 
        user_id: currentProfile.id, 
        material_id: materialId 
      });
      
      const { data: badge } = await sb.from('badges')
        .select('id')
        .eq('name', 'مستكشف')
        .maybeSingle();
      
      if(badge){
        const { data: userBadge } = await sb.from('user_badges')
          .select('*')
          .eq('user_id', currentProfile.id)
          .eq('badge_id', badge.id)
          .maybeSingle();
        
        if(userBadge){
          await sb.from('user_badges')
            .update({ quantity: (userBadge.quantity || 0) + 1 })
            .eq('id', userBadge.id);
        } else {
          await sb.from('user_badges')
            .insert({ user_id: currentProfile.id, badge_id: badge.id, quantity: 1 });
        }
        
        await recalculatePoints(currentProfile.id);
        toast('🎉 حصلت على وسام "مستكشف 🔍"!', 'success');
      }
    }
  } catch(e) { 
    console.error('Track error:', e); 
  }
}

function openMaterialModal(id = null){

    const { data: folders } = await sb.from('folders').select('*').order('order_index');
    let material = { title: '', description: '', type: 'link', url: '', folder_id: null };
    
    if(id){
      const { data } = await sb.from('materials').select('*').eq('id', id).single();
      if(data) material = data;
    }
    
    openModal(`<h2>${id ? 'تعديل' : 'إضافة'} ملف</h2><form id="materialForm">
      <div class="input-group"><label>الفولدر</label>
        <select id="matFolder">
          <option value="">-- بدون فولدر --</option>
          ${(folders || []).map(f => `<option value="${f.id}" ${material.folder_id == f.id ? 'selected' : ''}>${escapeHtml(f.name)}</option>`).join('')}
        </select>
      </div>
      <div class="input-group"><label>العنوان</label><input type="text" id="matTitle" value="${escapeHtml(material.title)}" required/></div>
      <div class="input-group"><label>الوصف</label><textarea id="matDesc" rows="2">${escapeHtml(material.description || '')}</textarea></div>
      <div class="input-group"><label>النوع</label>
        <select id="matType">
          <option value="link" ${material.type === 'link' ? 'selected' : ''}>رابط</option>
          <option value="file" ${material.type === 'file' ? 'selected' : ''}>ملف</option>
        </select>
      </div>
      <div class="input-group" id="matUrlGroup" style="display:${material.type === 'file' ? 'none' : 'block'}">
        <label>الرابط</label><input type="url" id="matUrl" value="${escapeHtml(material.url || '')}" placeholder="https://..."/>
      </div>
      <div class="input-group" id="matFileGroup" style="display:${material.type === 'file' ? 'block' : 'none'}">
        <label>الملف</label><input type="file" id="matFile"/>
      </div>
      <button type="submit" class="btn-primary" id="matSubmitBtn">رفع</button></form>`);
    
    $('#matType').addEventListener('change', () => {
      const isFile = $('#matType').value === 'file';
      $('#matUrlGroup').style.display = isFile ? 'none' : 'block';
      $('#matFileGroup').style.display = isFile ? 'block' : 'none';
    });
    
    $('#materialForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = $('#matSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span>';
      
      try {
        let finalUrl = $('#matUrl').value.trim();
        const type = $('#matType').value;
        
        if(type === 'file' && $('#matFile').files[0]){
          const file = $('#matFile').files[0];
          const fileName = `${Date.now()}_${file.name}`;
          const { error: uploadError } = await sb.storage.from('materials').upload(fileName, file);
          if(uploadError) throw uploadError;
          const { data: { publicUrl } } = sb.storage.from('materials').getPublicUrl(fileName);
          finalUrl = publicUrl;
        }
        
        const payload = {
          title: $('#matTitle').value.trim(),
          description: $('#matDesc').value.trim(),
          type: type,
          url: finalUrl,
          folder_id: $('#matFolder').value ? parseInt($('#matFolder').value) : null,
          uploaded_by: currentProfile.id
        };
        
        const { error } = id 
          ? await sb.from('materials').update(payload).eq('id', id)
          : await sb.from('materials').insert(payload);
        
        if(error) throw error;
        
        toast('✅ تم', 'success');
        closeModal();
        renderMaterials();
      } catch(err) {
        toast('❌ ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'رفع';
      }
    });
  })();
}

function renderQuestionsUI(){
  const container = $('#questionsContainer');
  if(!container) return;
  container.innerHTML = currentQuestions.map((q, i) => `
    <div class="dynamic-q-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px"><strong>سؤال ${i+1}</strong><button type="button" class="remove-q-btn" data-action="remove-question" data-idx="${i}">حذف</button></div>
      <div class="input-group"><label>النص</label><input type="text" class="q-field" data-idx="${i}" data-field="q" value="${escapeHtml(q.q)}" placeholder="اكتب السؤال..."/></div>
      <div class="input-group"><label>النوع</label><select class="q-type" data-idx="${i}"><option value="mc" ${q.type==='mc'?'selected':''}>اختيار</option><option value="tf" ${q.type==='tf'?'selected':''}>صح/خطأ</option></select></div>
      <div class="quiz-options" style="margin-bottom:10px">${q.options.map((opt, j) => `<div style="display:flex;align-items:center;gap:8px">
        <input type="radio" name="correct_${i}" ${q.correct==j?'checked':''} data-action="set-correct" data-idx="${i}" data-opt="${j}" style="width:20px;height:20px">
        ${q.type==='tf' ? `<span style="flex:1;font-weight:700">${opt}</span>` : `<input type="text" class="q-option" data-idx="${i}" data-opt="${j}" value="${escapeHtml(opt)}" placeholder="الخيار ${j+1}" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text)">`}
      </div>`).join('')}</div>
      <div class="input-group"><label>التفسير</label><input type="text" class="q-field" data-idx="${i}" data-field="explanation" value="${escapeHtml(q.explanation)}" placeholder="لماذا هذه الإجابة صحيحة؟"/></div>
    </div>
  `).join('');
  
  $$('[data-action="remove-question"]').forEach(b => b.addEventListener('click', () => { currentQuestions.splice(parseInt(b.dataset.idx), 1); renderQuestionsUI(); }));
  $$('.q-field').forEach(input => input.addEventListener('input', () => { currentQuestions[parseInt(input.dataset.idx)][input.dataset.field] = input.value; }));
  $$('.q-type').forEach(sel => sel.addEventListener('change', () => {
    const idx = parseInt(sel.dataset.idx);
    currentQuestions[idx].type = sel.value;
    if(sel.value === 'tf') { currentQuestions[idx].options = ['صح ✅', 'خطأ ❌']; currentQuestions[idx].correct = 0; }
    else { currentQuestions[idx].options = ['','','','']; currentQuestions[idx].correct = 0; }
    renderQuestionsUI();
  }));
  $$('.q-option').forEach(input => input.addEventListener('input', () => { currentQuestions[parseInt(input.dataset.idx)].options[parseInt(input.dataset.opt)] = input.value; }));
  $$('[data-action="set-correct"]').forEach(r => r.addEventListener('change', () => { currentQuestions[parseInt(r.dataset.idx)].correct = parseInt(r.dataset.opt); }));
}

async function startAssignment(id){
  const {data:a}=await sb.from('assignments').select('*').eq('id',id).single();
  const {data:ex}=await sb.from('submissions').select('*').eq('assignment_id',id).eq('user_id',currentProfile.id).maybeSingle();
  if(ex){toast(`⚠️ درجاتك: ${ex.score}`,'warning');return;}
  const qs=a.questions||[];
  let html=`<h2>${escapeHtml(a.title)}</h2><form id="quizForm">`;
  qs.forEach((q,i)=>{html+=`<div class="quiz-question"><h4>س${i+1}: ${escapeHtml(q.q)}</h4><div class="quiz-options">${(q.options||[]).map((o,j)=>`<button type="button" class="quiz-option" data-q="${i}" data-opt="${j}">${escapeHtml(o)}</button>`).join('')}</div><div class="quiz-explanation" id="exp-${i}"></div></div>`;});
  html+=`<button type="submit" class="btn-primary">تسليم</button></form>`;
  openModal(html);
  $$('.quiz-option').forEach(btn => btn.addEventListener('click', () => {
    btn.parentElement.querySelectorAll('.quiz-option').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
  }));
  $('#quizForm').addEventListener('submit', async e=>{
    e.preventDefault();
    if($('#quizForm').dataset.done)return; $('#quizForm').dataset.done='1';
    const answers=[]; let score=0;
    qs.forEach((q,i)=>{
      const sel=document.querySelector(`.quiz-option[data-q="${i}"].selected`);
      const ans=sel?parseInt(sel.dataset.opt):-1; answers.push(ans);
      document.querySelectorAll(`.quiz-option[data-q="${i}"]`).forEach((o,j)=>{ if(j===q.correct)o.classList.add('correct'); else if(j===ans)o.classList.add('wrong'); });
      if(ans===q.correct)score++;
      if(q.explanation){const el=$(`#exp-${i}`);el.textContent='💡 '+q.explanation;el.classList.add('show');}
    });
    await sb.from('submissions').insert({assignment_id:id,user_id:currentProfile.id,answers,score});
    const percent = qs.length > 0 ? (score / qs.length) * 100 : 0;
    toast(`🎉 ${score}/${qs.length} (${percent.toFixed(0)}%)`,'success');
    if(percent > 80) await checkAndAwardAutoBadges(currentProfile.id, 'assignment_pass');
    e.target.querySelector('button[type=submit]').textContent='تم ✔️';
  });
}

      <div class="input-group"><label>التفسير</label><input type="text" class="eq-field" data-idx="${i}" data-field="explanation" value="${escapeHtml(q.explanation)}"/></div>
    </div>`).join('');
  
  $$('[data-action="remove-exam-question"]').forEach(b => b.addEventListener('click', () => { currentQuestions.splice(parseInt(b.dataset.idx), 1); renderExamQuestionsUI(); }));
  $$('.eq-field').forEach(input => input.addEventListener('input', () => { currentQuestions[parseInt(input.dataset.idx)][input.dataset.field] = input.value; }));
  $$('.eq-type').forEach(sel => sel.addEventListener('change', () => {
    const idx = parseInt(sel.dataset.idx);
    currentQuestions[idx].type = sel.value;
    if(sel.value === 'tf') { currentQuestions[idx].options = ['صح ✅', 'خطأ ❌']; currentQuestions[idx].correct = 0; }
    else { currentQuestions[idx].options = ['','','','']; currentQuestions[idx].correct = 0; }
    renderExamQuestionsUI();
  }));
  $$('.eq-option').forEach(input => input.addEventListener('input', () => { currentQuestions[parseInt(input.dataset.idx)].options[parseInt(input.dataset.opt)] = input.value; }));
  $$('[data-action="set-exam-correct"]').forEach(r => r.addEventListener('change', () => { currentQuestions[parseInt(r.dataset.idx)].correct = parseInt(r.dataset.opt); }));
}

async function startExam(id){
  const {data:exam}=await sb.from('exams').select('*').eq('id',id).single();
  const {data:ex}=await sb.from('exam_attempts').select('*').eq('exam_id',id).eq('user_id',currentProfile.id).maybeSingle();
  if(ex){toast(`⚠️ درجاتك: ${ex.score}`,'warning');return;}
  const qs=exam.questions||[]; const dur=(exam.duration_minutes||30)*60*1000; const t0=Date.now();
  let html=`<h2>${escapeHtml(exam.title)}</h2><div style="background:var(--grad);color:#fff;padding:10px;border-radius:11px;text-align:center;margin-bottom:18px;font-weight:900">⏱️ <span id="examTimer">${exam.duration_minutes||30}:00</span></div><form id="examRunForm">`;
  qs.forEach((q,i)=>{html+=`<div class="quiz-question"><h4>س${i+1}: ${escapeHtml(q.q)}</h4><div class="quiz-options">${(q.options||[]).map((o,j)=>`<button type="button" class="quiz-option" data-q="${i}" data-opt="${j}">${escapeHtml(o)}</button>`).join('')}</div></div>`;});
  html+=`<button type="submit" class="btn-primary">تسليم</button></form>`;
  openModal(html);
  $$('.quiz-option').forEach(btn => btn.addEventListener('click', () => {
    btn.parentElement.querySelectorAll('.quiz-option').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
  }));
  const timer=setInterval(()=>{
    const rem=Math.max(0,dur-(Date.now()-t0));
    const el=$('#examTimer'); if(!el){clearInterval(timer);return;}
    el.textContent=`${Math.floor(rem/60000)}:${String(Math.floor(rem%60000/1000)).padStart(2,'0')}`;
    if(rem<=0){clearInterval(timer);$('#examRunForm')?.requestSubmit();}
  },1000);
  $('#examRunForm').addEventListener('submit', async e=>{
    e.preventDefault(); if($('#examRunForm').dataset.done)return; $('#examRunForm').dataset.done='1'; clearInterval(timer);
    const answers=[]; let score=0;
    qs.forEach((q,i)=>{ const sel=document.querySelector(`.quiz-option[data-q="${i}"].selected`); const ans=sel?parseInt(sel.dataset.opt):-1; answers.push(ans); if(ans===q.correct)score++; });
    await sb.from('exam_attempts').insert({exam_id:id,user_id:currentProfile.id,answers,score,finished_at:new Date().toISOString()});
    toast(`🎉 ${score}/${qs.length}`,'success');
    await checkAndAwardAutoBadges(currentProfile.id, 'exam_complete');
    closeModal(); renderExams();
  });
}

          title: title,

        }).select();

function submitProject(id){
  (async () => {
    const {data:ex}=await sb.from('project_submissions').select('*').eq('project_id',id).eq('user_id',currentProfile.id).maybeSingle();
    if(ex){toast('⚠️ سلّمت مسبقاً','warning');return;}
    openModal(`<h2>📤 تسليم البروجيكت</h2><form id="submitProjForm">
      <div class="input-group"><label>محتوى التسليم (نص)</label><textarea id="projContent" rows="4"></textarea></div>
      <div class="input-group"><label>ملف البروجيكت</label><input type="file" id="projFile"/></div>
      <button type="submit" class="btn-primary" id="projSubmitBtn">تسليم</button></form>`);
    $('#submitProjForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const btn = $('#projSubmitBtn'); btn.disabled = true; btn.innerHTML = '<span class="loader"></span>';
      try {
        let fileUrl = null;
        if($('#projFile').files[0]){
          const file = $('#projFile').files[0];
          const fileName = `project_${id}_${currentProfile.id}_${Date.now()}_${file.name}`;
          const { error: uploadError } = await sb.storage.from('materials').upload(fileName, file);
          if(uploadError) throw uploadError;
          const { data: { publicUrl } } = sb.storage.from('materials').getPublicUrl(fileName);
          fileUrl = publicUrl;
        }
        await sb.from('project_submissions').insert({project_id:id,user_id:currentProfile.id,content:$('#projContent').value.trim(),files: fileUrl ? [fileUrl] : []});
        await checkAndAwardAutoBadges(currentProfile.id, 'project_submit');
        toast('🎉 تم التسليم','success'); closeModal();
      } catch(err) { toast('❌ '+err.message,'error'); }
      finally { btn.disabled = false; btn.innerHTML = 'تسليم'; }
    });
  })();
}

async function deleteProjectFile(fileUrl, submissionId, projectId){
  if(!confirm('حذف الملف؟')) return;
  try {
    const urlObj = new URL(fileUrl);
    const pathParts = urlObj.pathname.split('/storage/v1/object/public/materials/');
    if(pathParts.length > 1) await sb.storage.from('materials').remove([pathParts[1]]);
    const { data: sub } = await sb.from('project_submissions').select('files').eq('id', submissionId).single();
    await sb.from('project_submissions').update({ files: (sub.files || []).filter(f => f !== fileUrl) }).eq('id', submissionId);
    toast('🗑️ تم','success');
    viewProjectSubmissions(projectId);
  } catch(err) { toast('❌ '+err.message,'error'); }
}

  openModal(`<h2>➕ إنشاء حساب</h2><form id="accForm">
    <div class="input-group"><label>الاسم</label><input type="text" id="accName" required/></div>
    <div class="input-group"><label>البريد</label><input type="email" id="accEmail" required/></div>
    <div class="input-group"><label>كلمة المرور</label><input type="text" id="accPass" value="123456" minlength="6" required/></div>
    <div class="input-group"><label>النوع</label><select id="accRole"><option value="student">طالب</option><option value="admin">إدارة</option></select></div>
    <button type="submit" class="btn-primary" id="accBtn">إنشاء</button></form>`);
  $('#accForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn=$('#accBtn'); btn.disabled=true; btn.innerHTML='<span class="loader"></span>';
    try{
      const temp = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
      const password = $('#accPass').value;
      const mustChange = (password === '123456');
      const { data, error } = await temp.auth.signUp({ email:$('#accEmail').value.trim().toLowerCase(), password:password, options:{ data:{ full_name:$('#accName').value.trim(), role:$('#accRole').value } } });
      if(error){ toast(/exists/i.test(error.message)?'❌ البريد مسجل':'❌ '+error.message,'error'); return; }
      if(data.user){
        await sb.from('profiles').update({ full_name:$('#accName').value.trim(), role:$('#accRole').value, must_change_password: mustChange }).eq('id', data.user.id);
        toast(mustChange ? '✅ تم (سيُطلب تغيير الباسورد)' : '✅ تم','success');
      }
      closeModal(); renderAdmin();
    }catch(ex){ toast('❌ '+ex.message,'error'); }
    finally{ btn.disabled=false; btn.innerHTML='إنشاء'; }
  });
}

async function editUserRole(id,cur){
  const r=prompt('الدور (student/admin):',cur);
  if(!r||!['student','admin'].includes(r))return;
  await sb.from('profiles').update({role:r}).eq('id',id);
  toast('✅','success'); renderAdmin();
}

async function openStudentBadgesModal(userId, userName){
  const [badgesRes, userBadgesRes] = await Promise.all([
    sb.from('badges').select('*').order('name'),
    sb.from('user_badges').select('*').eq('user_id', userId)
  ]);
  const badges = badgesRes.data || [];
  const userBadges = userBadgesRes.data || [];
  const userBadgesMap = {};
  userBadges.forEach(ub => userBadgesMap[ub.badge_id] = ub);
  const totalPoints = userBadges.reduce((sum, ub) => {
    const badge = badges.find(b => b.id === ub.badge_id);
    return sum + ((badge?.points || 0) * (ub.quantity || 1));
  }, 0);
  
  openModal(`<h2>🎖️ أوسمة ${escapeHtml(userName)}</h2>
    <div style="background:linear-gradient(135deg, rgba(139,92,246,.15), rgba(34,211,238,.08));padding:16px;border-radius:12px;margin-bottom:20px;text-align:center;border:1px solid rgba(139,92,246,.3)">
      <div style="font-size:14px;color:var(--muted);margin-bottom:6px">إجمالي النقاط</div>
      <div style="font-size:28px;font-weight:900;color:var(--accent)">⭐ ${totalPoints}</div>
    </div>
    <div style="max-height:400px;overflow-y:auto">
      ${badges.length === 0 ? '<div class="empty-state"><p>لا توجد أوسمة</p></div>' : badges.map(b => {
        const userBadge = userBadgesMap[b.id];
        const hasBadge = !!userBadge;
        const qty = userBadge?.quantity || 0;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:12px;flex:1">
            <div style="font-size:32px">${escapeHtml(b.icon || '🏅')}</div>
            <div><div style="font-weight:700">${escapeHtml(b.name)}</div><div style="font-size:11px;color:var(--muted)">⭐ ${b.points || 0} نقطة</div></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            ${hasBadge ? `<span class="badge badge-success">✓ ${qty}</span>` : ''}
            ${hasBadge ? `<button class="btn btn-danger btn-sm" data-action="remove-student-badge" data-uid="${userId}" data-bid="${b.id}" data-name="${escapeHtml(userName)}">🗑️</button>` : `<button class="btn btn-success btn-sm" data-action="add-student-badge" data-uid="${userId}" data-bid="${b.id}" data-name="${escapeHtml(userName)}">➕</button>`}
          </div>
        </div>`;
      }).join('')}
    </div>`);
  
  $$('[data-action="add-student-badge"]').forEach(b => b.addEventListener('click', () => addBadgeToStudent(b.dataset.uid, parseInt(b.dataset.bid), b.dataset.name)));
  $$('[data-action="remove-student-badge"]').forEach(b => b.addEventListener('click', () => removeBadgeFromStudent(b.dataset.uid, parseInt(b.dataset.bid), b.dataset.name)));
}

async function addBadgeToStudent(userId, badgeId, userName){
  const { data: existing } = await sb.from('user_badges').select('*').eq('user_id', userId).eq('badge_id', badgeId).maybeSingle();
  if(existing){
    await sb.from('user_badges').update({ quantity: (existing.quantity || 0) + 1 }).eq('id', existing.id);
  } else {
    await sb.from('user_badges').insert({ user_id: userId, badge_id: badgeId, quantity: 1 });
  }
  await recalculatePoints(userId);
  toast('✅ تم المنح', 'success');
  openStudentBadgesModal(userId, userName);
}

async function removeBadgeFromStudent(userId, badgeId, userName){
  if(!confirm('حذف الوسام؟')) return;
  const { data: existing } = await sb.from('user_badges').select('*').eq('user_id', userId).eq('badge_id', badgeId).maybeSingle();
  if(existing){
    if(existing.quantity > 1){
      await sb.from('user_badges').update({ quantity: existing.quantity - 1 }).eq('id', existing.id);
    } else {
      await sb.from('user_badges').delete().eq('id', existing.id);
    }
  }
  await recalculatePoints(userId);
  toast('🗑️ تم الحذف', 'success');
  openStudentBadgesModal(userId, userName);
}

async function deleteUser(userId, userName){
  if(!confirm(`حذف حساب ${userName} نهائياً؟`)) return;
  if(!confirm(`تأكيد نهائي!`)) return;
  try {
    const { error } = await sb.rpc('delete_user_account', { target_user_id: userId });
    if(error) throw error;
    toast('🗑️ تم الحذف نهائياً', 'success');
    renderAdmin();
  } catch(err) {
    toast('❌ ' + err.message, 'error');
  }
}

(async ()=>{
  try{ const { data:{ session } } = await sb.auth.getSession(); if(session) await loadUser(); }catch(e){ console.error(e); }
})();
</script>
