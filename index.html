<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة السادات | English Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b15; --bg2: #0b1120;
      --surface: rgba(255,255,255,.04); --surface2: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.09); --border2: rgba(255,255,255,.16);
      --text: #e8ecf6; --muted: #8b93a8;
      --primary: #8b5cf6; --primary2: #6366f1; --accent: #22d3ee;
      --success: #34d399; --warning: #fbbf24; --danger: #f87171;
      --grad: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #22d3ee 100%);
      --glow: 0 0 25px rgba(139,92,246,.35);
      --shadow: 0 8px 30px rgba(0,0,0,.45);
      --r: 14px; --r-lg: 22px; --side: 270px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: #2a3350; border-radius: 10px; }
    .muted { color: var(--muted); font-size: 11px; }
    .gradient-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .bg-glow { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; opacity: .5; }
    .glow-1 { width: 520px; height: 520px; background: rgba(139,92,246,.22); top: -160px; right: -120px; animation: drift 14s ease-in-out infinite; }
    .glow-2 { width: 460px; height: 460px; background: rgba(34,211,238,.14); bottom: -160px; left: -120px; animation: drift 18s ease-in-out infinite reverse; }
    @keyframes drift { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(40px, -40px); } }
    .screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
    .screen.active { display: block; }
    #loginScreen.active { display: flex; align-items: center; justify-content: center; padding: 20px; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 44px 44px; }
    .login-container { background: rgba(13,18,35,.75); backdrop-filter: blur(24px); border: 1px solid var(--border2); border-radius: var(--r-lg); padding: 42px 36px; width: 100%; max-width: 440px; box-shadow: var(--shadow); animation: up .5s ease; }
    @keyframes up { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .login-header { text-align: center; margin-bottom: 28px; }
    .logo-circle { width: 86px; height: 86px; background: var(--grad); border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 42px; margin: 0 auto 16px; box-shadow: var(--glow); }
    .login-header h1 { font-size: 30px; font-weight: 900; }
    .school-name { font-weight: 800; margin-top: 6px; font-size: 15px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .login-note { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--border2); padding: 10px; border-radius: 10px; }
    .form { display: none; }
    .form.active { display: block; animation: fade .3s; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; color: #c3cadd; }
    .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px 15px; background: rgba(255,255,255,.05); border: 1.5px solid var(--border); border-radius: 11px; color: var(--text); font-family: inherit; font-size: 15px; transition: .25s; min-height: 48px; }
    .input-group input:focus, .input-group select:focus, .input-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139,92,246,.18); background: rgba(139,92,246,.06); }
    .input-group select option { background: var(--bg2); color: var(--text); }
    .btn-primary { width: 100%; padding: 14px; background: var(--grad); color: #fff; border: none; border-radius: 11px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; transition: .25s; box-shadow: 0 6px 22px rgba(99,102,241,.35); min-height: 48px; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(139,92,246,.5); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center; min-height: 20px; font-weight: 600; }
    #appScreen.active { display: flex; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); z-index: 90; }
    .overlay.show { display: block; }
    .sidebar { width: var(--side); background: rgba(10,14,28,.95); backdrop-filter: blur(20px); border-left: 1px solid var(--border); height: 100vh; position: fixed; right: 0; top: 0; display: flex; flex-direction: column; transition: transform .3s; z-index: 100; }
    .sidebar-header { padding: 22px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
    .logo-small { width: 46px; height: 46px; background: var(--grad); border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .sidebar-header h2 { font-size: 17px; font-weight: 900; }
    .sidebar-nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 11px; color: #aab2c8; cursor: pointer; transition: .2s; margin-bottom: 4px; font-weight: 700; font-size: 14px; border: 1px solid transparent; }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: linear-gradient(135deg, rgba(139,92,246,.25), rgba(34,211,238,.12)); color: #fff; border-color: rgba(139,92,246,.45); }
    .nav-item .icon { font-size: 20px; }
    .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
    .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .user-avatar { width: 44px; height: 44px; background: var(--grad); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }
    .user-name { font-weight: 800; font-size: 14px; }
    .user-role { font-size: 12px; color: var(--accent); font-weight: 700; }
    .btn-ghost, .btn-logout { width: 100%; padding: 10px; border-radius: 9px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; transition: .2s; margin-bottom: 8px; min-height: 44px; border: 1px solid; }
    .btn-ghost { background: var(--surface); border-color: var(--border); color: #aab2c8; }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-logout { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.3); color: var(--danger); }
    .btn-logout:hover { background: rgba(248,113,113,.2); }
    .main-content { flex: 1; margin-right: var(--side); min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { background: rgba(10,14,28,.85); backdrop-filter: blur(16px); padding: 14px 24px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .menu-toggle { display: none; background: none; border: none; font-size: 26px; cursor: pointer; color: var(--text); }
    .page-title { font-size: 19px; font-weight: 900; flex: 1; }
    .points-badge { background: var(--grad); color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: 900; display: flex; align-items: center; gap: 6px; font-size: 14px; }
    .content-area { padding: 24px; flex: 1; }
    .stats-grid, .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-bottom: 24px; }
    .stat-card, .card, .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; transition: .3s; }
    .stat-card:hover, .item-card:hover { transform: translateY(-4px); border-color: rgba(139,92,246,.5); box-shadow: 0 12px 35px rgba(0,0,0,.5); }
    .stat-icon { width: 48px; height: 48px; background: var(--grad); border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 23px; margin-bottom: 12px; }
    .stat-value { font-size: 28px; font-weight: 900; }
    .stat-label { color: var(--muted); font-size: 13px; font-weight: 700; }
    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .card-title { font-size: 17px; font-weight: 900; }
    .item-card h3 { font-size: 15.5px; font-weight: 800; margin-bottom: 6px; }
    .item-card p { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 12px; }
    .item-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .badge { padding: 4px 11px; border-radius: 20px; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; border: 1px solid; }
    .badge-primary { background: rgba(139,92,246,.14); color: #c4b5fd; border-color: rgba(139,92,246,.35); }
    .badge-success { background: rgba(52,211,153,.12); color: #6ee7b7; border-color: rgba(52,211,153,.35); }
    .badge-warning { background: rgba(251,191,36,.12); color: #fcd34d; border-color: rgba(251,191,36,.35); }
    .badge-danger { background: rgba(248,113,113,.12); color: #fca5a5; border-color: rgba(248,113,113,.35); }
    .badge-info { background: rgba(34,211,238,.12); color: #67e8f9; border-color: rgba(34,211,238,.35); }
    .btn { padding: 8px 16px; border: none; border-radius: 9px; font-family: inherit; font-weight: 800; font-size: 13px; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; text-decoration: none;}
    .btn-sm { padding: 6px 12px; font-size: 12px; min-height: 36px; }
    .btn-primary-solid { background: var(--grad); color: #fff; }
    .btn-primary-solid:hover { transform: translateY(-2px); }
    .btn-success { background: rgba(52,211,153,.15); color: #6ee7b7; border: 1px solid rgba(52,211,153,.4); }
    .btn-danger { background: rgba(248,113,113,.13); color: #fca5a5; border: 1px solid rgba(248,113,113,.4); }
    .btn-warning { background: rgba(251,191,36,.13); color: #fcd34d; border: 1px solid rgba(251,191,36,.4); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border2); color: #aab2c8; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
    .leaderboard-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; }
    .leaderboard-item.top-1 { background: linear-gradient(135deg, rgba(251,191,36,.16), rgba(251,191,36,.04)); border-color: rgba(251,191,36,.5); }
    .rank { width: 42px; height: 42px; background: var(--grad); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }
    .leaderboard-info { flex: 1; min-width: 0; }
    .leaderboard-name { font-weight: 800; font-size: 14px; }
    .leaderboard-points { font-weight: 900; color: var(--accent); font-size: 17px; flex-shrink: 0; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(3,6,14,.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 18px; }
    .modal.active { display: flex; }
    .modal-content { background: #0d1326; border: 1px solid var(--border2); border-radius: var(--r-lg); max-width: 620px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; animation: up .3s; }
    .modal-close { position: absolute; top: 14px; left: 14px; width: 36px; height: 36px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-body { padding: 30px; }
    .toast-container { position: fixed; top: 18px; left: 18px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: #0d1326; border: 1px solid var(--border2); padding: 14px 18px; border-radius: 11px; box-shadow: var(--shadow); min-width: 270px; border-right: 4px solid var(--primary); animation: slideIn .3s; font-weight: 700; font-size: 13.5px; pointer-events: auto; }
    .toast.success { border-right-color: var(--success); }
    .toast.error { border-right-color: var(--danger); }
    @keyframes slideIn { from { transform: translateX(-110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .quiz-question { background: var(--surface); border: 1px solid var(--border); padding: 18px; border-radius: var(--r); margin-bottom: 14px; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .quiz-option { padding: 12px 15px; background: rgba(255,255,255,.04); border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; text-align: right; color: var(--text); min-height: 44px; display: flex; align-items: center; }
    .quiz-option.selected { border-color: var(--primary); background: rgba(139,92,246,.16); }
    .quiz-option.correct { border-color: var(--success); background: rgba(52,211,153,.14); }
    .quiz-option.wrong { border-color: var(--danger); background: rgba(248,113,113,.13); }
    .quiz-explanation { background: rgba(34,211,238,.09); border: 1px solid rgba(34,211,238,.3); padding: 11px; border-radius: 9px; margin-top: 10px; font-size: 12.5px; color: #a5f3fc; display: none; }
    .quiz-explanation.show { display: block; }
    .announcement-card { background: var(--surface); border: 1px solid var(--border); border-right: 4px solid var(--primary); border-radius: var(--r); padding: 18px; margin-bottom: 13px; }
    .announcement-card.urgent { border-right-color: var(--danger); }
    .announcement-header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .announcement-title { font-weight: 800; font-size: 15px; }
    .announcement-date { color: var(--muted); font-size: 11.5px; }
    .announcement-content { color: #b8c0d4; line-height: 1.8; font-size: 13.5px; }
    .loader { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.25); border-radius: 50%; border-top-color: #fff; animation: spin .8s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 56px; margin-bottom: 14px; opacity: .5; }
    .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { padding: 12px 14px; text-align: right; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { background: rgba(255,255,255,.04); font-weight: 800; color: #aab2c8; font-size: 12px; white-space: nowrap; }
    .dynamic-q-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed var(--border); }
    .remove-q-btn { background: rgba(248,113,113,0.2); color: #fca5a5; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 10px; }
    @media (max-width: 900px) {
      .sidebar { transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-right: 0; }
      .menu-toggle { display: block; }
      .content-area { padding: 16px; }
    }
    @media (max-width: 600px) {
      .login-container { padding: 30px 20px; }
      .stats-grid, .grid { grid-template-columns: 1fr; }
      .btn-group { flex-direction: column; }
      .btn-group .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <div id="loginScreen" class="screen active">
    <div class="login-container">
      <div class="login-header">
        <div class="logo-circle"><span>🎓</span></div>
        <h1 class="gradient-text">English Hub</h1>
        <p class="school-name">مدرسة السادات الثانوية بنين</p>
        <p class="subtitle">المحلة الكبرى</p>
      </div>
      <form id="loginForm" class="form active">
        <div class="input-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" required placeholder="example@sadat.edu" />
        </div>
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button type="submit" id="loginBtn" class="btn-primary">دخول 🚀</button>
        <p id="loginError" class="error-msg"></p>
      </form>
      <div class="login-note">🔐 الحسابات يتم إنشاؤها بواسطة الإدارة فقط</div>
    </div>
  </div>

  <div id="appScreen" class="screen">
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-small">🎓</div>
        <div>
          <h2 class="gradient-text">English Hub</h2>
          <small class="muted">السادات الثانوية بنين</small>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">?</div>
          <div class="user-details">
            <div class="user-name" id="userName">...</div>
            <div class="user-role" id="userRole">...</div>
          </div>
        </div>
        <button class="btn-ghost" id="changePassBtn">🔑 تغيير كلمة المرور</button>
        <button class="btn-logout" id="logoutBtn">تسجيل الخروج 🚪</button>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h2 class="page-title" id="pageTitle">الرئيسية</h2>
        <div class="points-badge"><span>⭐</span><span id="userPoints">0</span></div>
      </header>
      <div class="content-area" id="contentArea"></div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">×</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://zhvcliqqsvvobhynzmvx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FP7G3btTd-TupPNdODp2oA_Il0UhtPu';
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null, currentProfile = null, currentPage = 'dashboard';
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    function toast(msg, type='info'){
      const t=document.createElement('div'); t.className=`toast ${type}`; t.textContent=msg;
      $('#toastContainer').appendChild(t);
      setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},3500);
    }
    function openModal(html){ $('#modalBody').innerHTML=html; $('#modal').classList.add('active'); }
    function closeModal(){ $('#modal').classList.remove('active'); }
    $('#modalClose').addEventListener('click', closeModal);
    $('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

    function escapeHtml(s){ if(s==null)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function formatDate(d){ if(!d)return''; try{return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return d} }
    function toLocalInput(d){ if(!d)return''; const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,16); }
    function getAutoStatus(start, end) {
        const now = new Date();
        const s = start ? new Date(start) : null;
        const e = end ? new Date(end) : null;
        if (!s) return 'upcoming';
        if (now < s) return 'upcoming';
        if (e && now > e) return 'completed';
        return 'live';
    }

    $('#loginForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const btn=$('#loginBtn'), err=$('#loginError');
      err.textContent=''; btn.disabled=true; btn.innerHTML='<span class="loader"></span> جاري الدخول...';
      try{
        const { error } = await sb.auth.signInWithPassword({ email: $('#loginEmail').value.trim().toLowerCase(), password: $('#loginPassword').value });
        if(error){ err.textContent = error.message.includes('Invalid') ? '❌ البريد أو كلمة المرور غير صحيحة' : '❌ ' + error.message; return; }
        await loadUser();
      }catch(ex){ err.textContent='🌐 تعذر الاتصال'; }
      finally{ btn.disabled=false; btn.innerHTML='دخول 🚀'; }
    });

    $('#logoutBtn').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });
    $('#changePassBtn').addEventListener('click', ()=>{
      openModal(`<h2>🔑 تغيير كلمة المرور</h2><form id="cpForm">
        <div class="input-group"><label>كلمة المرور الجديدة</label><input type="password" id="cpNew" minlength="6" required/></div>
        <button type="submit" class="btn-primary">حفظ</button></form>`);
      $('#cpForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const { error } = await sb.auth.updateUser({ password: $('#cpNew').value });
        if(error){ toast('❌ '+error.message,'error'); return; }
        // لو كان الحساب عليه علامة، نشيلها
        if(currentProfile.must_change_password){
          await sb.from('profiles').update({ must_change_password: false }).eq('id', currentProfile.id);
          currentProfile.must_change_password = false;
        }
        toast('✅ تم التغيير','success'); closeModal();
      });
    });

    async function loadUser(){
      const { data:{ user } } = await sb.auth.getUser();
      if(!user) return;
      currentUser = user;
      const { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if(error){ await sb.auth.signOut(); $('#loginError').textContent = '⚠️ جداول قاعدة البيانات غير جاهزة. تواصل مع الدعم.'; return; }
      let p = profile;
      if(!p){
        const meta = user.user_metadata || {};
        const { data: np } = await sb.from('profiles').insert({ id:user.id, email:user.email, full_name:meta.full_name||user.email.split('@')[0], role:meta.role||'student' }).select().single();
        p = np;
      }
      if(p && p.active === false){ await sb.auth.signOut(); $('#loginError').textContent='⛔ الحساب موقوف'; return; }
      currentProfile = p;
      showApp();
    }

    function showApp(){
      $('#loginScreen').classList.remove('active');
      $('#appScreen').classList.add('active');
      $('#userName').textContent = currentProfile.full_name;
      $('#userRole').textContent = {student:'طالب',teacher:'مدرس',admin:'مدير'}[currentProfile.role] || currentProfile.role;
      $('#userAvatar').textContent = (currentProfile.full_name||'?').charAt(0);
      $('#userPoints').textContent = currentProfile.points || 0;
      buildSidebar();
      navigate('dashboard');

      // فحص لو الحساب على باسورد افتراضي
      if(currentProfile.must_change_password === true){
        showPasswordChangeWarning();
      }
    }

    function buildSidebar(){

        {id:'dashboard',icon:'🏠',label:'الرئيسية',roles:['student','teacher','admin']},

        // تظهر للمدرس والأدمن فقط

        {id:'badges',icon:'🎖️',label:'إدارة الأوسمة',roles:['teacher','admin']},
        {id:'lessons',icon:'📚',label:'الحصص',roles:['student','teacher','admin']},
        {id:'materials',icon:'📖',label:'التعلم الذاتي',roles:['student','teacher','admin']},
        {id:'exams',icon:'📝',label:'الامتحانات',roles:['student','teacher','admin']},
        {id:'projects',icon:'🎯',label:'البروجيكت',roles:['student','teacher','admin']},
        {id:'support',icon:'💬',label:'الدعم الفني',roles:['student','teacher','admin']},

    function navigate(page){
      currentPage=page;
      $$('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.page===page));

        dashboard:'الرئيسية',
        announcements:'إدارة الإعلانات',
        badges:'إدارة الأوسمة',
        lessons:'الحصص',
        materials:'التعلم الذاتي',
        exams:'الامتحانات',
        projects:'البروجيكت',
        support:'الدعم الفني',

    const isStaff = () => currentProfile.role==='teacher' || currentProfile.role==='admin';

    // ================= DASHBOARD (Merged) =================

            <div class="card">
              <div class="card-header">
                <h3 class="card-title">📢 الإعلانات</h3>
              </div>
              <div class="empty-state" style="padding:30px 20px">
                <div class="icon" style="font-size:40px">📢</div>
                <p style="font-size:13px">لا توجد إعلانات حالياً</p>
              </div>

    // ================= LESSONS =================
    async function renderLessons(){
      const area=$('#contentArea');
      area.innerHTML='<div class="empty-state"><span class="loader"></span></div>';
      const { data: lessons } = await sb.from('lessons').select('*, profiles(full_name)').order('start_time',{ascending:true});
      const staff=isStaff();
      const addBtn=staff?`<button class="btn btn-primary-solid" onclick="openLessonModal()">+ إضافة حصة</button>`:'';
      const body=(!lessons||!lessons.length)?`<div class="empty-state"><div class="icon">📚</div><p>لا توجد حصص</p></div>`:`<div class="grid">${lessons.map(l=>lessonCard(l,staff)).join('')}</div>`;
      area.innerHTML=`<div class="card"><div class="card-header"><h3 class="card-title">📚 الحصص الدراسية</h3>${addBtn}</div>${body}</div>`;
    }
    function lessonCard(l,staff){
      const status = getAutoStatus(l.start_time, l.end_time);
      const M={upcoming:['قادمة','badge-info'],live:['مباشر الآن 🔴','badge-danger'],completed:['انتهت','badge-success']};
      const s=M[status]||M.upcoming;
      return `<div class="item-card"><div class="item-card-header"><span class="badge ${s[1]}">${s[0]}</span></div>
        <h3>${escapeHtml(l.title)}</h3><p>${escapeHtml(l.description||'')}</p>
        <div class="item-meta"><span class="badge badge-primary">👨‍🏫 ${escapeHtml(l.profiles?.full_name||'مدرس')}</span><span class="badge badge-info">🕐 ${l.start_time?formatDate(l.start_time):'غير محدد'}</span></div>
        ${l.lesson_link ? `<a href="${escapeHtml(l.lesson_link)}" target="_blank" class="btn btn-success btn-sm" style="margin-bottom:10px; width:100%">🔗 دخول الحصة</a>` : ''}
        <div class="btn-group">${staff
          ?`<button class="btn btn-sm btn-outline" onclick="openAttendanceModal(${l.id})">📋 الحضور</button><button class="btn btn-sm btn-warning" onclick="openLessonModal(${l.id})">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteLesson(${l.id})">🗑️</button>`
          :`<button class="btn btn-sm btn-success" onclick="markAttendance(${l.id},'present')">✅ حاضر</button><button class="btn btn-sm btn-danger" onclick="markAttendance(${l.id},'absent')">❌ غائب</button>`}</div></div>`;
    }
    window.openLessonModal=async function(id=null){
      let L={title:'',description:'',start_time:'',end_time:'',lesson_link:'',status:'upcoming'};
      if(id){ const {data}=await sb.from('lessons').select('*').eq('id',id).single(); if(data)L=data; }
      openModal(`<h2>${id?'تعديل':'إضافة'} حصة</h2><form id="lessonForm">
        <div class="input-group"><label>عنوان الحصة</label><input type="text" id="lessonTitle" value="${escapeHtml(L.title)}" required/></div>
        <div class="input-group"><label>الوصف</label><textarea id="lessonDesc" rows="2">${escapeHtml(L.description||'')}</textarea></div>
        <div class="input-group"><label>رابط الحصة (Zoom/Meet)</label><input type="url" id="lessonLink" value="${escapeHtml(L.lesson_link||'')}" placeholder="https://..."/></div>
        <div class="input-group"><label>وقت البداية</label><input type="datetime-local" id="lessonStart" value="${toLocalInput(L.start_time)}"/></div>
        <div class="input-group"><label>وقت النهاية</label><input type="datetime-local" id="lessonEnd" value="${toLocalInput(L.end_time)}"/></div>
        <button type="submit" class="btn-primary">حفظ</button></form>`);
      $('#lessonForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const p={title:$('#lessonTitle').value.trim(),description:$('#lessonDesc').value.trim(),lesson_link:$('#lessonLink').value.trim(),
          start_time:$('#lessonStart').value?new Date($('#lessonStart').value).toISOString():null,
          end_time:$('#lessonEnd').value?new Date($('#lessonEnd').value).toISOString():null,
          teacher_id:currentProfile.id};
        const {error}=id?await sb.from('lessons').update(p).eq('id',id):await sb.from('lessons').insert(p);
        if(error){toast('❌ '+error.message,'error');return;}
        toast('✅ تم الحفظ','success'); closeModal(); renderLessons();
      });
    };
    window.deleteLesson=async function(id){ if(!confirm('حذف؟'))return; await sb.from('lessons').delete().eq('id',id); toast('🗑️ تم','success'); renderLessons(); };
    window.openAttendanceModal=async function(lessonId){
      const {data:students}=await sb.from('profiles').select('*').eq('role','student').order('full_name');
      const {data:att}=await sb.from('attendance').select('*').eq('lesson_id',lessonId);
      const map={}; (att||[]).forEach(a=>map[a.user_id]=a.status);
      openModal(`<h2>📋 سجل الحضور</h2><div style="max-height:420px;overflow-y:auto">
        ${(students||[]).map(s=>{const st=map[s.id]||'absent';return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)">
          <span style="font-weight:700;font-size:13.5px">${escapeHtml(s.full_name)}</span>
          <select onchange="setAttendance(${lessonId},'${s.id}',this.value)" style="padding:6px 10px;border-radius:8px;background:var(--bg2);color:var(--text);border:1px solid var(--border)">
            <option value="present" ${st==='present'?'selected':''}>✅ حاضر</option>
            <option value="absent" ${st==='absent'?'selected':''}>❌ غائب</option>
            <option value="late" ${st==='late'?'selected':''}>⏰ متأخر</option></select></div>`;}).join('')}</div>`);
    };
    window.setAttendance=async function(l,u,st){ await sb.from('attendance').upsert({lesson_id:l,user_id:u,status:st},{onConflict:'user_id,lesson_id'}); toast('✅','success'); };
    window.markAttendance=async function(l,st){ await sb.from('attendance').upsert({lesson_id:l,user_id:currentProfile.id,status:st},{onConflict:'user_id,lesson_id'}); toast('✅','success'); };

    // ================= MATERIALS (With File Upload & Dynamic Quiz) =================
    async function renderMaterials(){

      const {data:mats}=await sb.from('materials').select('*').order('created_at',{ascending:false});
      const {data:assigns}=await sb.from('assignments').select('*');
      const addBtn=staff?`<div class="btn-group"><button class="btn btn-primary-solid" onclick="openMaterialModal()">+ مادة جديدة</button><button class="btn btn-success" onclick="openAssignmentModal()">+ واجب تفاعلي</button></div>`:'';

        <div class="btn-group"><button class="btn btn-primary-solid btn-sm" onclick="startAssignment(${a.id})">ابدأ</button>${staff?`<button class="btn btn-danger btn-sm" onclick="deleteAssignment(${a.id})">🗑️</button>`:''}</div></div>`).join('')}</div></div>`:'';

    window.openMaterialModal=function(){
      openModal(`<h2>📖 إضافة مادة</h2><form id="materialForm">
        <div class="input-group"><label>العنوان</label><input type="text" id="matTitle" required/></div>
        <div class="input-group"><label>الوصف</label><textarea id="matDesc" rows="2"></textarea></div>
        <div class="input-group"><label>النوع</label><select id="matType" onchange="toggleMatInput()"><option value="link">رابط خارجي</option><option value="file">ملف من الجهاز (PDF/صورة)</option><option value="video">فيديو (رابط)</option></select></div>
        <div class="input-group" id="matUrlGroup"><label>الرابط (URL)</label><input type="url" id="matUrl" placeholder="https://..."/></div>
        <div class="input-group" id="matFileGroup" style="display:none"><label>اختر الملف</label><input type="file" id="matFile" accept=".pdf,.jpg,.jpeg,.png,.mp4"/></div>
        <button type="submit" class="btn-primary" id="matSubmitBtn">رفع</button></form>`);
      window.toggleMatInput = () => {
        const isFile = $('#matType').value === 'file';
        $('#matUrlGroup').style.display = isFile ? 'none' : 'block';
        $('#matFileGroup').style.display = isFile ? 'block' : 'none';
      };
      $('#materialForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const btn=$('#matSubmitBtn'); btn.disabled=true; btn.innerHTML='<span class="loader"></span> جاري الرفع...';
        try {
          let finalUrl = $('#matUrl').value.trim();
          const type = $('#matType').value;
          if(type === 'file' && $('#matFile').files[0]) {
            const file = $('#matFile').files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}.${fileExt}`;
            const { error: uploadError, data } = await sb.storage.from('materials').upload(fileName, file);
            if(uploadError) throw uploadError;
            const { data: { publicUrl } } = sb.storage.from('materials').getPublicUrl(fileName);
            finalUrl = publicUrl;
          }
          const {error}=await sb.from('materials').insert({title:$('#matTitle').value.trim(),description:$('#matDesc').value.trim(),type: type==='file'?'file':type, url:finalUrl, uploaded_by:currentProfile.id});
          if(error) throw error;
          toast('✅ تم الرفع','success'); closeModal(); renderMaterials();
        } catch(err) {
          toast('❌ '+err.message,'error');
        } finally {
          btn.disabled=false; btn.innerHTML='رفع';
        }
      });
    };
    window.deleteMaterial=async function(id){ if(!confirm('حذف؟'))return; await sb.from('materials').delete().eq('id',id); toast('🗑️','success'); renderMaterials(); };

    // Dynamic Quiz Builder
    let currentQuestions = [];
    window.openAssignmentModal=function(){
      currentQuestions = [];
      openModal(`<h2>📝 إنشاء واجب</h2><form id="assignForm">
        <div class="input-group"><label>العنوان</label><input type="text" id="assignTitle" required/></div>
        <div class="input-group"><label>الوصف</label><textarea id="assignDesc" rows="2"></textarea></div>
        <div id="questionsContainer"></div>
        <button type="button" class="btn btn-outline" style="width:100%; margin-bottom:15px" onclick="addQuestionUI()">+ إضافة سؤال جديد</button>
        <button type="submit" class="btn-primary">حفظ الواجب</button></form>`);
      renderQuestionsUI();
      $('#assignForm').addEventListener('submit', async e=>{
        e.preventDefault();
        if(currentQuestions.length === 0) { toast('⚠️ أضف سؤالاً واحداً على الأقل','warning'); return; }
        // Validate all questions have answers
        for(let i=0; i<currentQuestions.length; i++) {
            if(!currentQuestions[i].q || currentQuestions[i].correct === undefined) {
                toast(`⚠️ أكمل بيانات السؤال رقم ${i+1}`,'warning'); return;
            }
        }

    window.startAssignment=async function(id){
      const {data:a}=await sb.from('assignments').select('*').eq('id',id).single();
      const {data:ex}=await sb.from('submissions').select('*').eq('assignment_id',id).eq('user_id',currentProfile.id).maybeSingle();
      if(ex){toast(`⚠️ حليت هذا الواجب سابقاً. درجاتك: ${ex.score}`,'warning');return;}
      const qs=a.questions||[];
      let html=`<h2>${escapeHtml(a.title)}</h2><p class="muted" style="margin-bottom:18px">${escapeHtml(a.description||'')}</p><form id="quizForm">`;
      qs.forEach((q,i)=>{
        html+=`<div class="quiz-question"><h4>س${i+1}: ${escapeHtml(q.q)}</h4><div class="quiz-options">
          ${(q.options||[]).map((o,j)=>`<button type="button" class="quiz-option" data-q="${i}" data-opt="${j}" onclick="pickOption(this)">${escapeHtml(o)}</button>`).join('')}
          </div><div class="quiz-explanation" id="exp-${i}"></div></div>`;
      });
      html+=`<button type="submit" class="btn-primary">تسليم الواجب</button></form>`;
      openModal(html);
      window.pickOption=function(btn){ btn.parentElement.querySelectorAll('.quiz-option').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); };
      $('#quizForm').addEventListener('submit', async e=>{
        e.preventDefault();
        if($('#quizForm').dataset.done)return; $('#quizForm').dataset.done='1';
        const answers=[]; let score=0;
        qs.forEach((q,i)=>{
          const sel=document.querySelector(`.quiz-option[data-q="${i}"].selected`);
          const ans=sel?parseInt(sel.dataset.opt):-1; answers.push(ans);
          document.querySelectorAll(`.quiz-option[data-q="${i}"]`).forEach((o,j)=>{
            if(j===q.correct)o.classList.add('correct'); else if(j===ans)o.classList.add('wrong');
          });
          if(ans===q.correct)score++;
          if(q.explanation){const el=$(`#exp-${i}`);el.textContent='💡 '+q.explanation;el.classList.add('show');}
        });
        await sb.from('submissions').insert({assignment_id:id,user_id:currentProfile.id,answers,score});
        await addPoints(currentProfile.id, score*5);
        toast(`🎉 ${score}/${qs.length} — حصلت على ${score*5} نقطة!`,'success');
        e.target.querySelector('button[type=submit]').textContent='تم التسليم ✔️';
      });

    window.startExam=async function(id){
      const {data:exam}=await sb.from('exams').select('*').eq('id',id).single();
      const {data:ex}=await sb.from('exam_attempts').select('*').eq('exam_id',id).eq('user_id',currentProfile.id).maybeSingle();
      if(ex){toast(`⚠️ درجاتك السابقة: ${ex.score}`,'warning');return;}
      const qs=exam.questions||[]; const dur=(exam.duration_minutes||30)*60*1000; const t0=Date.now();
      let html=`<h2>${escapeHtml(exam.title)}</h2><div style="background:var(--grad);color:#fff;padding:10px;border-radius:11px;text-align:center;margin-bottom:18px;font-weight:900">⏱️ <span id="examTimer">${exam.duration_minutes||30}:00</span></div><form id="examRunForm">`;
      qs.forEach((q,i)=>{html+=`<div class="quiz-question"><h4>س${i+1}: ${escapeHtml(q.q)}</h4><div class="quiz-options">${(q.options||[]).map((o,j)=>`<button type="button" class="quiz-option" data-q="${i}" data-opt="${j}" onclick="pickOption(this)">${escapeHtml(o)}</button>`).join('')}</div></div>`;});
      html+=`<button type="submit" class="btn-primary">تسليم</button></form>`;
      openModal(html);
      const timer=setInterval(()=>{
        const rem=Math.max(0,dur-(Date.now()-t0));
        const el=$('#examTimer'); if(!el){clearInterval(timer);return;}
        el.textContent=`${Math.floor(rem/60000)}:${String(Math.floor(rem%60000/1000)).padStart(2,'0')}`;
        if(rem<=0){clearInterval(timer);$('#examRunForm')?.requestSubmit();}
      },1000);
      $('#examRunForm').addEventListener('submit', async e=>{
        e.preventDefault(); if($('#examRunForm').dataset.done)return; $('#examRunForm').dataset.done='1'; clearInterval(timer);
        const answers=[]; let score=0;
        qs.forEach((q,i)=>{ const sel=document.querySelector(`.quiz-option[data-q="${i}"].selected`); const ans=sel?parseInt(sel.dataset.opt):-1; answers.push(ans); if(ans===q.correct)score++; });
        await sb.from('exam_attempts').insert({exam_id:id,user_id:currentProfile.id,answers,score,finished_at:new Date().toISOString()});
        await addPoints(currentProfile.id, score*10);
        toast(`🎉 ${score}/${qs.length} — +${score*10} نقطة!`,'success'); closeModal(); renderExams();
      });
    };

      `;
    }

    window.openAnnouncementModal = function(){
      openModal(`
        <h2>📢 إضافة إعلان جديد</h2>
        <form id="announcementForm">
          <div class="input-group">
            <label>عنوان الإعلان</label>
            <input type="text" id="annTitle" required placeholder="مثال: مسابقة أفضل طالب في اللغة الإنجليزية">
          </div>

          <div class="input-group">
            <label>نص الإعلان</label>
            <textarea id="annContent" rows="5" required placeholder="اكتب تفاصيل الإعلان هنا..."></textarea>
          </div>

          <div class="input-group">
            <label>نوع الإعلان</label>
            <select id="annType">
              <option value="general">عام</option>
              <option value="urgent">عاجل</option>
              <option value="opportunity">فرصة / مسابقة</option>
            </select>
          </div>

          <button type="submit" class="btn-primary">نشر الإعلان</button>
        </form>
      `);

      $('#announcementForm').addEventListener('submit', async e => {
        e.preventDefault();

        const { error } = await sb.from('announcements').insert({
          title: $('#annTitle').value.trim(),
          content: $('#annContent').value.trim(),
          type: $('#annType').value,
          created_by: currentProfile.id
        });

        if(error){
          toast('❌ ' + error.message, 'error');
          return;
        }

        toast('✅ تم نشر الإعلان', 'success');

    window.deleteAnnouncement = async function(id){
      if(!confirm('هل تريد حذف هذا الإعلان؟')) return;

      const { error } = await sb.from('announcements').delete().eq('id', id);

      if(error){
        toast('❌ ' + error.message, 'error');
        return;
      }

      toast('🗑️ تم حذف الإعلان', 'success');
      renderAnnouncements();
    };


    // ================= BADGES MANAGEMENT =================
    async function renderBadges(){
      const area = $('#contentArea');

      if(!isStaff()){
        area.innerHTML = '<div class="empty-state"><div class="icon">🔒</div><p>غير مصرح</p></div>';
        return;
      }

      area.innerHTML = '<div class="empty-state"><span class="loader"></span><p style="margin-top:12px">جاري تحميل الأوسمة...</p></div>';

      const { data, error } = await sb
        .from('badges')
        .select('*')
        .order('id', { ascending:false });

      if(error){
        area.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${escapeHtml(error.message)}</p></div>`;
        return;
      }

      const badges = data || [];

      const body = badges.length ? `
        <div class="grid">
          ${badges.map(b => `
            <div class="item-card" style="text-align:center">
              <div style="font-size:46px;margin-bottom:10px">${escapeHtml(b.icon || '🏅')}</div>
              <h3>${escapeHtml(b.name)}</h3>
              <p>${escapeHtml(b.description || 'بدون وصف')}</p>
              <div class="item-meta" style="justify-content:center">
                <span class="badge badge-warning">⭐ ${b.points || 0} نقطة</span>
              </div>
              <div class="btn-group">
                <button class="btn btn-success btn-sm" onclick="openAwardModal(${b.id})">🎖️ منح لطالب</button>
                <button class="btn btn-danger btn-sm" onclick="deleteBadge(${b.id})">🗑️ حذف</button>
              </div>
            </div>
          `).join('')}
        </div>
      ` : `
        <div class="empty-state">
          <div class="icon">🎖️</div>
          <p>لا توجد أوسمة حالياً</p>
        </div>
      `;

      area.innerHTML = `
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">🎖️ إدارة الأوسمة</h3>
            <div class="btn-group">
              <button class="btn btn-primary-solid" onclick="openBadgeModal()">➕ إضافة وسام</button>
              <button class="btn btn-success" onclick="openAwardModal()">🎁 منح وسام لطالب</button>
            </div>
          </div>
          ${body}
        </div>
      `;
    }

    window.openBadgeModal = function(){
      openModal(`
        <h2>🎖️ إضافة وسام جديد</h2>
        <form id="badgeForm">
          <div class="input-group">
            <label>اسم الوسام</label>
            <input type="text" id="badgeName" required placeholder="مثال: بطل القراءة">
          </div>

          <div class="input-group">
            <label>الأيقونة</label>
            <input type="text" id="badgeIcon" value="🏅" placeholder="مثال: 🏅 🥇 🌟">
          </div>

          <div class="input-group">
            <label>عدد النقاط</label>
            <input type="number" id="badgePoints" value="10" min="0">
          </div>

          <div class="input-group">
            <label>وصف الوسام</label>
            <textarea id="badgeDesc" rows="3" placeholder="متى يحصل الطالب على هذا الوسام؟"></textarea>
          </div>

          <button type="submit" class="btn-primary">حفظ الوسام</button>
        </form>
      `);

      $('#badgeForm').addEventListener('submit', async e => {
        e.preventDefault();

        const { error } = await sb.from('badges').insert({
          name: $('#badgeName').value.trim(),
          icon: $('#badgeIcon').value.trim() || '🏅',
          points: parseInt($('#badgePoints').value) || 0,
          description: $('#badgeDesc').value.trim()
        });

        if(error){
          toast('❌ ' + error.message, 'error');
          return;
        }

        toast('✅ تم إضافة الوسام', 'success');
        closeModal();
        renderBadges();
      });
    };

    window.openAwardModal = async function(preselectedBadgeId = null){
      const [badgesRes, studentsRes] = await Promise.all([
        sb.from('badges').select('*').order('name'),
        sb.from('profiles').select('*').eq('role','student').order('full_name')
      ]);

      const badges = badgesRes.data || [];
      const students = studentsRes.data || [];

      if(!badges.length){
        toast('⚠️ أضف وسام الأول', 'warning');
        return;
      }

      if(!students.length){
        toast('⚠️ لا يوجد طلاب', 'warning');
        return;
      }

      openModal(`
        <h2>🎁 منح وسام لطالب</h2>
        <form id="awardForm">
          <div class="input-group">
            <label>اختر الطالب</label>
            <select id="awardStudent" required>
              ${students.map(s => `
                <option value="${s.id}">${escapeHtml(s.full_name || s.email)}</option>
              `).join('')}
            </select>
          </div>

          <div class="input-group">
            <label>اختر الوسام</label>
            <select id="awardBadge" required>
              ${badges.map(b => `
                <option value="${b.id}" ${preselectedBadgeId == b.id ? 'selected' : ''}>
                  ${escapeHtml(b.icon || '🏅')} ${escapeHtml(b.name)} - ${b.points || 0} نقطة
                </option>
              `).join('')}
            </select>
          </div>

          <div class="input-group">
            <label>العدد</label>
            <input type="number" id="awardQty" value="1" min="1">
          </div>

          <button type="submit" class="btn-primary">منح الوسام</button>
        </form>
      `);

      $('#awardForm').addEventListener('submit', async e => {
        e.preventDefault();

        const studentId = $('#awardStudent').value;
        const badgeId = parseInt($('#awardBadge').value);
        const qty = parseInt($('#awardQty').value) || 1;

        const { data: badge, error: badgeError } = await sb
          .from('badges')
          .select('*')
          .eq('id', badgeId)
          .single();

        if(badgeError || !badge){
          toast('❌ لم يتم العثور على الوسام', 'error');
          return;
        }

        const { data: existing } = await sb
          .from('user_badges')
          .select('*')
          .eq('user_id', studentId)
          .eq('badge_id', badgeId)
          .maybeSingle();

        if(existing){
          const { error } = await sb
            .from('user_badges')
            .update({ quantity: (existing.quantity || 0) + qty })
            .eq('id', existing.id);

          if(error){
            toast('❌ ' + error.message, 'error');
            return;
          }
        } else {
          const { error } = await sb.from('user_badges').insert({
            user_id: studentId,
            badge_id: badgeId,
            quantity: qty
          });

          if(error){
            toast('❌ ' + error.message, 'error');
            return;
          }
        }

        await addPoints(studentId, (badge.points || 0) * qty);

        toast(`✅ تم منح الوسام وإضافة ${(badge.points || 0) * qty} نقطة`, 'success');
        closeModal();
        renderBadges();
      });
    };

    window.deleteBadge = async function(id){
      if(!confirm('هل تريد حذف هذا الوسام؟')) return;

      const { error } = await sb.from('badges').delete().eq('id', id);

      if(error){
        toast('❌ ' + error.message, 'error');
        return;
      }

      toast('🗑️ تم حذف الوسام', 'success');
      renderBadges();
    };
    //gg
    function showPasswordChangeWarning(){
      openModal(`
        <h2 style="color:var(--warning);text-align:center">⚠️ تنبيه أمني</h2>
        <div style="background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);padding:16px;border-radius:10px;margin-bottom:20px">
          <p style="font-size:14px;line-height:1.8;color:#fcd34d">
            حسابك حالياً يستخدم <strong>كلمة مرور افتراضية</strong>.<br>
            لحماية حسابك من السرقة، يجب تغيير كلمة المرور الآن.
          </p>
        </div>
        <form id="forceChangePassForm">
          <div class="input-group">
            <label>كلمة المرور الجديدة</label>
            <input type="password" id="forceNewPass" minlength="6" required placeholder="6 أحرف على الأقل"/>
          </div>
          <div class="input-group">
            <label>تأكيد كلمة المرور</label>
            <input type="password" id="forceConfirmPass" minlength="6" required placeholder="أعد كتابة كلمة المرور"/>
          </div>
          <button type="submit" class="btn-primary">تغيير كلمة المرور الآن 🔒</button>
        </form>
      `);

      // منع إغلاق النافذة
      $('#modalClose').style.display = 'none';
      $('#modal').onclick = null;

      $('#forceChangePassForm').addEventListener('submit', async e => {
        e.preventDefault();
        const newPass = $('#forceNewPass').value;
        const confirmPass = $('#forceConfirmPass').value;

        if(newPass !== confirmPass){
          toast('❌ كلمتا المرور غير متطابقتين', 'error');
          return;
        }

        if(newPass === '123456'){
          toast('❌ لا يمكن استخدام كلمة المرور الافتراضية', 'error');
          return;
        }

        const { error } = await sb.auth.updateUser({ password: newPass });
        if(error){
          toast('❌ ' + error.message, 'error');
          return;
        }

        // تحديث حالة الحساب
        await sb.from('profiles').update({ must_change_password: false }).eq('id', currentProfile.id);
        currentProfile.must_change_password = false;

        // إعادة تفعيل إغلاق النافذة
        $('#modalClose').style.display = 'flex';
        $('#modal').addEventListener('click', ev => { if(ev.target.id === 'modal') closeModal(); });

        toast('✅ تم تغيير كلمة المرور بنجاح', 'success');
        closeModal();
      });
    }
    
    // ================= ADMIN =================
    async function renderAdmin(){
      if(currentProfile.role!=='admin'){ $('#contentArea').innerHTML='<div class="empty-state"><div class="icon">🔒</div><p>غير مصرح</p></div>'; return; }
      const area=$('#contentArea');
      const [u,l,m]=await Promise.all([sb.from('profiles').select('*').order('created_at',{ascending:false}),sb.from('lessons').select('id'),sb.from('materials').select('id')]);
      const users=u.data||[];
      area.innerHTML=`<div class="stats-grid">
        <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value">${users.filter(x=>x.role==='student').length}</div><div class="stat-label">الطلاب</div></div>
        <div class="stat-card"><div class="stat-icon">👨‍🏫</div><div class="stat-value">${users.filter(x=>x.role==='teacher').length}</div><div class="stat-label">المدرسون</div></div></div>
      <div class="card"><div class="card-header"><h3 class="card-title">⚙️ إدارة الحسابات</h3><button class="btn btn-primary-solid" onclick="openCreateAccountModal()">➕ إنشاء حساب</button></div>
      <div class="table-wrapper"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>النقاط</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>
        ${users.map(x=>`<tr><td>${escapeHtml(x.full_name)}</td><td style="font-size:12px">${escapeHtml(x.email)}</td>
          <td><span class="badge ${x.role==='admin'?'badge-danger':x.role==='teacher'?'badge-warning':'badge-primary'}">${x.role}</span></td>
          <td>${x.points||0}</td>
          <td><span class="badge ${x.active===false?'badge-danger':'badge-success'}">${x.active===false?'موقوف':'نشط'}</span></td>
          <td><div class="btn-group">
            <button class="btn btn-sm btn-outline" onclick="editUserRole('${x.id}','${x.role}')">الدور</button>
            <button class="btn btn-sm btn-warning" onclick="editUserPoints('${x.id}',${x.points||0})">النقاط</button>
            ${x.id!==currentProfile.id?`<button class="btn btn-sm ${x.active===false?'btn-success':'btn-danger'}" onclick="toggleUserActive('${x.id}',${x.active===false})">${x.active===false?'تفعيل':'إيقاف'}</button>`:''}
          </div></td></tr>`).join('')}
      </tbody></table></div></div>`;
    }
    window.openCreateAccountModal=function(){
      openModal(`<h2>➕ إنشاء حساب</h2><form id="accForm">
        <div class="input-group"><label>الاسم</label><input type="text" id="accName" required/></div>
        <div class="input-group"><label>البريد</label><input type="email" id="accEmail" required/></div>
        <div class="input-group"><label>كلمة المرور</label><input type="text" id="accPass" minlength="6" required/></div>
        <div class="input-group"><label>النوع</label><select id="accRole"><option value="student">طالب</option><option value="teacher">مدرس</option><option value="admin">مدير</option></select></div>
        <button type="submit" class="btn-primary" id="accBtn">إنشاء</button></form>`);
      $('#accForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const btn=$('#accBtn'); btn.disabled=true; btn.innerHTML='<span class="loader"></span>';
        try{
          const temp = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
          const password = $('#accPass').value;
          const mustChange = (password === '123456');
          const { data, error } = await temp.auth.signUp({ email:$('#accEmail').value.trim().toLowerCase(), password:password, options:{ data:{ full_name:$('#accName').value.trim(), role:$('#accRole').value } } });          if(error){ toast(/exists/i.test(error.message)?'❌ البريد مسجل':'❌ '+error.message,'error'); return; }
          if(data.user){
            await sb.from('profiles').update({ 
              full_name:$('#accName').value.trim(), 
              role:$('#accRole').value,
              must_change_password: mustChange
            }).eq('id', data.user.id);
            toast(mustChange ? '✅ تم الإنشاء (سيُطلب من المستخدم تغيير كلمة المرور)' : '✅ تم الإنشاء','success');
          }
          closeModal(); renderAdmin();
        }catch(ex){ toast('❌ '+ex.message,'error'); }
        finally{ btn.disabled=false; btn.innerHTML='إنشاء'; }
      });
    };
    window.editUserRole=async function(id,cur){ const r=prompt('الدور (student/teacher/admin):',cur); if(!r||!['student','teacher','admin'].includes(r))return; await sb.from('profiles').update({role:r}).eq('id',id); toast('✅','success'); renderAdmin(); };
    window.editUserPoints=async function(id,cur){ const p=parseInt(prompt('النقاط:',cur)); if(isNaN(p))return; await sb.from('profiles').update({points:p}).eq('id',id); toast('✅','success'); renderAdmin(); };
    window.toggleUserActive=async function(id,activate){ if(!activate && !confirm('إيقاف؟'))return; await sb.from('profiles').update({active:activate}).eq('id',id); toast('✅','success'); renderAdmin(); };

    async function addPoints(uid,amount){
      const {data:p}=await sb.from('profiles').select('points').eq('id',uid).single();
      const np=(p?.points||0)+amount;
      await sb.from('profiles').update({points:np}).eq('id',uid);
      if(uid===currentProfile.id){ currentProfile.points=np; $('#userPoints').textContent=np; }
    }

    (async ()=>{
      try{ const { data:{ session } } = await sb.auth.getSession(); if(session) await loadUser(); }catch(e){ console.error(e); }
    })();
  </script>
