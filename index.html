<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b15; --bg2: #0b1120;
      --surface: rgba(255,255,255,.04); --surface2: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.09); --border2: rgba(255,255,255,.16);
      --text: #e8ecf6; --muted: #8b93a8;
      --primary: #8b5cf6; --primary2: #6366f1; --accent: #22d3ee;
      --success: #34d399; --warning: #fbbf24; --danger: #f87171;
      --grad: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #22d3ee 100%);
      --glow: 0 0 25px rgba(139,92,246,.35);
      --shadow: 0 8px 30px rgba(0,0,0,.45);
      --r: 14px; --r-lg: 22px; --side: 270px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: #2a3350; border-radius: 10px; }
    .muted { color: var(--muted); font-size: 11px; }
    .gradient-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .bg-glow { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; opacity: .5; }
    .glow-1 { width: 520px; height: 520px; background: rgba(139,92,246,.22); top: -160px; right: -120px; animation: drift 14s ease-in-out infinite; }
    .glow-2 { width: 460px; height: 460px; background: rgba(34,211,238,.14); bottom: -160px; left: -120px; animation: drift 18s ease-in-out infinite reverse; }
    @keyframes drift { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(40px, -40px); } }
    .screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
    .screen.active { display: block; }
    #loginScreen.active { display: flex; align-items: center; justify-content: center; padding: 20px; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 44px 44px; }
    .login-container { background: rgba(13,18,35,.75); backdrop-filter: blur(24px); border: 1px solid var(--border2); border-radius: var(--r-lg); padding: 42px 36px; width: 100%; max-width: 440px; box-shadow: var(--shadow); animation: up .5s ease; }

    .school-name { font-weight: 800; margin-top: 6px; font-size: 15px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .login-note { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--border2); padding: 10px; border-radius: 10px; }
    .form { display: none; }
    .form.active { display: block; animation: fade .3s; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .input-group { margin-bottom: 16px; }

    .input-group input:focus, .input-group select:focus, .input-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139,92,246,.18); background: rgba(139,92,246,.06); }

    .btn-primary { width: 100%; padding: 14px; background: var(--grad); color: #fff; border: none; border-radius: 11px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; transition: .25s; box-shadow: 0 6px 22px rgba(99,102,241,.35); min-height: 48px; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(139,92,246,.5); }

    #appScreen.active { display: flex; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); z-index: 90; }
    .overlay.show { display: block; }
    .sidebar { width: var(--side); background: rgba(10,14,28,.95); backdrop-filter: blur(20px); border-left: 1px solid var(--border); height: 100vh; position: fixed; right: 0; top: 0; display: flex; flex-direction: column; transition: transform .3s; z-index: 100; }
    .sidebar-header { padding: 22px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
    .logo-small { width: 46px; height: 46px; background: var(--grad); border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }

    .sidebar-nav { flex: 1; padding: 14px 10px; overflow-y: auto; }

    .nav-item:hover { background: var(--surface2); color: var(--text); }

    .nav-item .icon { font-size: 20px; }
    .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
    .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .user-avatar { width: 44px; height: 44px; background: var(--grad); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }
    .user-name { font-weight: 800; font-size: 14px; }
    .user-role { font-size: 12px; color: var(--accent); font-weight: 700; }
    .btn-ghost, .btn-logout { width: 100%; padding: 10px; border-radius: 9px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; transition: .2s; margin-bottom: 8px; min-height: 44px; border: 1px solid; }

    .content-area { padding: 24px; flex: 1; }
    .stats-grid, .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-bottom: 24px; }

    .stat-card:hover, .item-card:hover { transform: translateY(-4px); border-color: rgba(139,92,246,.5); box-shadow: 0 12px 35px rgba(0,0,0,.5); }
    .stat-icon { width: 48px; height: 48px; background: var(--grad); border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 23px; margin-bottom: 12px; }
    .stat-value { font-size: 28px; font-weight: 900; }
    .stat-label { color: var(--muted); font-size: 13px; font-weight: 700; }

    .badge-success { background: rgba(52,211,153,.12); color: #6ee7b7; border-color: rgba(52,211,153,.35); }

    .btn-success { background: rgba(52,211,153,.15); color: #6ee7b7; border: 1px solid rgba(52,211,153,.4); }
    .btn-danger { background: rgba(248,113,113,.13); color: #fca5a5; border: 1px solid rgba(248,113,113,.4); }
    .btn-warning { background: rgba(251,191,36,.13); color: #fcd34d; border: 1px solid rgba(251,191,36,.4); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(3,6,14,.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 18px; }

    .modal-content { background: #0d1326; border: 1px solid var(--border2); border-radius: var(--r-lg); max-width: 620px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; animation: up .3s; }
    .modal-close { position: absolute; top: 14px; left: 14px; width: 36px; height: 36px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-body { padding: 30px; }
    .toast-container { position: fixed; top: 18px; left: 18px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: #0d1326; border: 1px solid var(--border2); padding: 14px 18px; border-radius: 11px; box-shadow: var(--shadow); min-width: 270px; border-right: 4px solid var(--primary); animation: slideIn .3s; font-weight: 700; font-size: 13.5px; pointer-events: auto; }
    .toast.success { border-right-color: var(--success); }
    .toast.error { border-right-color: var(--danger); }
    @keyframes slideIn { from { transform: translateX(-110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .quiz-option.selected { border-color: var(--primary); background: rgba(139,92,246,.16); }

    .announcement-card { background: var(--surface); border: 1px solid var(--border); border-right: 4px solid var(--primary); border-radius: var(--r); padding: 18px; margin-bottom: 13px; }

    .announcement-title { font-weight: 800; font-size: 15px; }
    .announcement-date { color: var(--muted); font-size: 11.5px; }
    .announcement-content { color: #b8c0d4; line-height: 1.8; font-size: 13.5px; }
    .loader { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.25); border-radius: 50%; border-top-color: #fff; animation: spin .8s linear infinite; vertical-align: middle; }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }

      .menu-toggle { display: block; }
      .content-area { padding: 16px; }
      .stats-grid, .grid, .badges-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

      th, td { padding: 10px 8px; }
    }
  </style>

    function toast(msg, type='info'){
      const t=document.createElement('div'); t.className=`toast ${type}`; t.textContent=msg;
      $('#toastContainer').appendChild(t);
      setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},3500);
    }
    function openModal(html){ $('#modalBody').innerHTML=html; $('#modal').classList.add('active'); $('#modalClose').style.display='flex'; }
    function closeModal(){ $('#modal').classList.remove('active'); }
    $('#modalClose').addEventListener('click', closeModal);
    $('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

    function escapeHtml(s){ if(s==null)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function formatDate(d){ if(!d)return''; try{return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return d} }
    function toLocalInput(d){ if(!d)return''; const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,16); }

    $('#loginForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const btn=$('#loginBtn'), err=$('#loginError');
      err.textContent=''; btn.disabled=true; btn.innerHTML='<span class="loader"></span> جاري الدخول...';
      try{
        const { error } = await sb.auth.signInWithPassword({ email: $('#loginEmail').value.trim().toLowerCase(), password: $('#loginPassword').value });
        if(error){ err.textContent = error.message.includes('Invalid') ? '❌ البريد أو كلمة المرور غير صحيحة' : '❌ ' + error.message; return; }
        await loadUser();
      }catch(ex){ err.textContent='🌐 تعذر الاتصال'; }
      finally{ btn.disabled=false; btn.innerHTML='دخول 🚀'; }
    });

    $('#logoutBtn').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });
    
    $('#changePassBtn').addEventListener('click', ()=>{
      openModal(`<h2>🔑 تغيير كلمة المرور</h2><form id="cpForm">
        <div class="input-group"><label>كلمة المرور الجديدة</label><input type="password" id="cpNew" minlength="6" required placeholder="6 أحرف على الأقل"/></div>
        <div class="input-group"><label>تأكيد كلمة المرور</label><input type="password" id="cpConfirm" minlength="6" required placeholder="أعد كتابة كلمة المرور"/></div>
        <button type="submit" class="btn-primary">حفظ</button></form>`);
      $('#cpForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const newPass = $('#cpNew').value;
        const confirmPass = $('#cpConfirm').value;
        
        if(newPass !== confirmPass){
          toast('❌ كلمتا المرور غير متطابقتين', 'error');
          return;
        }
        
        if(newPass === '123456'){
          toast('❌ لا يمكن استخدام كلمة المرور الافتراضية', 'error');
          return;
        }
        
        const { error } = await sb.auth.updateUser({ password: newPass });
        if(error){ toast('❌ '+error.message,'error'); return; }
        
        if(currentProfile.must_change_password){
          await sb.from('profiles').update({ must_change_password: false }).eq('id', currentProfile.id);
          currentProfile.must_change_password = false;
        }
        
        toast('✅ تم التغيير','success'); closeModal();
      });
    });

    async function loadUser(){
      const { data:{ user } } = await sb.auth.getUser();
      if(!user) return;
      currentUser = user;
      const { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if(error){ await sb.auth.signOut(); $('#loginError').textContent = '⚠️ جداول قاعدة البيانات غير جاهزة'; return; }
      let p = profile;
      if(!p){
        const meta = user.user_metadata || {};
        const { data: np } = await sb.from('profiles').insert({ id:user.id, email:user.email, full_name:meta.full_name||user.email.split('@')[0], role:meta.role||'student' }).select().single();
        p = np;
      }
      if(p && p.active === false){ await sb.auth.signOut(); $('#loginError').textContent='⛔ الحساب موقوف'; return; }
      currentProfile = p;
      showApp();
    }

    function showApp(){
      $('#loginScreen').classList.remove('active');
      $('#appScreen').classList.add('active');
      $('#userName').textContent = currentProfile.full_name;
      $('#userRole').textContent = {student:'طالب',teacher:'مدرس',admin:'مدير'}[currentProfile.role] || currentProfile.role;
      $('#userAvatar').textContent = (currentProfile.full_name||'?').charAt(0);
      $('#userPoints').textContent = currentProfile.points || 0;
      buildSidebar();
      navigate('dashboard');
      
      // فحص لو الحساب على باسورد افتراضي
      setTimeout(() => {
        if(currentProfile.must_change_password === true){
          showPasswordChangeWarning();
        }
      }, 500);
    }

    function showPasswordChangeWarning(){
      openModal(`
        <h2 style="color:var(--warning);text-align:center">⚠️ تنبيه أمني</h2>
        <div style="background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);padding:16px;border-radius:10px;margin-bottom:20px">
          <p style="font-size:14px;line-height:1.8;color:#fcd34d">
            حسابك حالياً يستخدم <strong>كلمة مرور افتراضية</strong>.<br>
            لحماية حسابك من السرقة، يجب تغيير كلمة المرور الآن.
          </p>
        </div>
        <form id="forceChangePassForm">
          <div class="input-group">
            <label>كلمة المرور الجديدة</label>
            <input type="password" id="forceNewPass" minlength="6" required placeholder="6 أحرف على الأقل"/>
          </div>
          <div class="input-group">
            <label>تأكيد كلمة المرور</label>
            <input type="password" id="forceConfirmPass" minlength="6" required placeholder="أعد كتابة كلمة المرور"/>
          </div>
          <button type="submit" class="btn-primary">تغيير كلمة المرور الآن 🔒</button>
        </form>
      `);

      $('#modalClose').style.display = 'none';
      $('#modal').onclick = null;

      $('#forceChangePassForm').addEventListener('submit', async e => {
        e.preventDefault();
        const newPass = $('#forceNewPass').value;
        const confirmPass = $('#forceConfirmPass').value;

        if(newPass !== confirmPass){
          toast('❌ كلمتا المرور غير متطابقتين', 'error');
          return;
        }

        if(newPass === '123456'){
          toast('❌ لا يمكن استخدام كلمة المرور الافتراضية', 'error');
          return;
        }

        const { error } = await sb.auth.updateUser({ password: newPass });
        if(error){
          toast('❌ ' + error.message, 'error');
          return;
        }

        await sb.from('profiles').update({ must_change_password: false }).eq('id', currentProfile.id);
        currentProfile.must_change_password = false;

        $('#modalClose').style.display = 'flex';
        $('#modal').addEventListener('click', ev => { if(ev.target.id === 'modal') closeModal(); });

        toast('✅ تم تغيير كلمة المرور بنجاح', 'success');
        closeModal();

    function buildSidebar(){
      const role = currentProfile.role;
      const items = [
        {id:'dashboard',icon:'🏠',label:'الرئيسية',roles:['student','teacher','admin']},
        {id:'announcements',icon:'📢',label:'إدارة الإعلانات',roles:['teacher','admin']},
        {id:'badges',icon:'🎖️',label:'إدارة الأوسمة',roles:['teacher','admin']},
        {id:'lessons',icon:'📚',label:'الحصص',roles:['student','teacher','admin']},
        {id:'materials',icon:'📖',label:'التعلم الذاتي',roles:['student','teacher','admin']},
        {id:'exams',icon:'📝',label:'الامتحانات',roles:['student','teacher','admin']},
        {id:'projects',icon:'🎯',label:'البروجيكت',roles:['student','teacher','admin']},
        {id:'support',icon:'💬',label:'الدعم الفني',roles:['student','teacher','admin']},
        {id:'admin',icon:'⚙️',label:'لوحة التحكم',roles:['admin']},

      const nav=$('#sidebarNav'); nav.innerHTML='';

        const el=document.createElement('div');
        el.className='nav-item'; el.dataset.page=item.id;
        el.innerHTML=`<span class="icon">${item.icon}</span><span>${item.label}</span>`;
        el.addEventListener('click',()=>navigate(item.id));
        nav.appendChild(el);

    function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }
    $('#menuToggle').addEventListener('click', ()=>{ $('#sidebar').classList.toggle('open'); $('#overlay').classList.toggle('show'); });
    $('#overlay').addEventListener('click', closeSidebar);

    function navigate(page){
      currentPage=page;
      $$('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.page===page));
      const titles={dashboard:'الرئيسية',announcements:'إدارة الإعلانات',badges:'إدارة الأوسمة',lessons:'الحصص',materials:'التعلم الذاتي',exams:'الامتحانات',projects:'البروجيكت',support:'الدعم الفني',admin:'لوحة التحكم'};
      $('#pageTitle').textContent=titles[page]||'';
      closeSidebar();
      const R={dashboard:renderDashboard,announcements:renderAnnouncements,badges:renderBadges,lessons:renderLessons,materials:renderMaterials,exams:renderExams,projects:renderProjects,support:renderSupport,admin:renderAdmin};
      if(R[page]) R[page]();
    }
    window.navigate = navigate;
    const isStaff = () => currentProfile.role==='teacher' || currentProfile.role==='admin';

    async function recalculatePoints(userId){
      const { data: userBadges } = await sb.from('user_badges').select('quantity, badges(points)').eq('user_id', userId);
      const totalPoints = (userBadges || []).reduce((sum, ub) => {
        return sum + ((ub.badges?.points || 0) * (ub.quantity || 1));
      }, 0);
      await sb.from('profiles').update({ points: totalPoints }).eq('id', userId);
      if(userId === currentProfile.id){
        currentProfile.points = totalPoints;
        $('#userPoints').textContent = totalPoints;
      }
      return totalPoints;
    }

    async function renderDashboard(){

      area.innerHTML='<div class="empty-state"><span class="loader"></span><p style="margin-top:12px">جاري التحميل...</p></div>';

          currentProfile.role === 'student' 
            ? sb.from('user_badges').select('quantity, badges(id, name, icon, points)').eq('user_id', currentProfile.id)

          myBadgesHTML = `
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">🎖️ أوسمتي</h3>
              </div>
              <div class="empty-state" style="padding:30px 20px">

              </div>
            </div>

        let annHTML = '';
        if(announcements.length > 0){

            <div class="card">
              <div class="card-header">
                <h3 class="card-title">📢 آخر الإعلانات</h3>

                <div class="announcement-card ${a.type === 'urgent' ? 'urgent' : ''}">

                    <div class="announcement-title">

                    </div>

                  <div class="announcement-content">${escapeHtml(a.content || '')}</div>
                </div>

            </div>

          const medals = ['🥇','🥈','🥉'];
          lbHTML = `
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">🏆 المتصدرون</h3>
              </div>
              ${leaderboard.map((s, i) => `
                <div class="leaderboard-item ${i < 3 ? 'top-' + (i+1) : ''}">
                  <div class="rank">${i < 3 ? medals[i] : i + 1}</div>
                  <div class="leaderboard-info">

    async function renderAnnouncements(){
      const area = $('#contentArea');
      if(!isStaff()){ area.innerHTML = '<div class="empty-state"><div class="icon">🔒</div><p>غير مصرح</p></div>'; return; }
      area.innerHTML = '<div class="empty-state"><span class="loader"></span></div>';
      const { data, error } = await sb.from('announcements').select('*').order('created_at', { ascending:false });
      if(error){ area.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${escapeHtml(error.message)}</p></div>`; return; }
      const announcements = data || [];
      const body = announcements.length ? announcements.map(a => `
        <div class="announcement-card ${a.type === 'urgent' ? 'urgent' : ''}">
          <div class="announcement-header">
            <div class="announcement-title">${a.type === 'urgent' ? '🚨' : a.type === 'opportunity' ? '🌟' : '📢'} ${escapeHtml(a.title)}</div>
            <div class="announcement-date">${formatDate(a.created_at)}</div>

    window.openAwardModal = async function(preselectedBadgeId = null){
      const [badgesRes, studentsRes] = await Promise.all([
        sb.from('badges').select('*').order('name'),
        sb.from('profiles').select('*').eq('role','student').order('full_name')
      ]);
      const badges = badgesRes.data || [];
      const students = studentsRes.data || [];
      if(!badges.length){ toast('⚠️ أضف وسام الأول', 'warning'); return; }
      if(!students.length){ toast('⚠️ لا يوجد طلاب', 'warning'); return; }
      openModal(`<h2>🎁 منح وسام</h2><form id="awardForm">
        <div class="input-group"><label>الطالب</label><select id="awardStudent" required>${students.map(s => `<option value="${s.id}">${escapeHtml(s.full_name)}</option>`).join('')}</select></div>
        <div class="input-group"><label>الوسام</label><select id="awardBadge" required>${badges.map(b => `<option value="${b.id}" ${preselectedBadgeId == b.id ? 'selected' : ''}>${escapeHtml(b.icon || '🏅')} ${escapeHtml(b.name)} - ${b.points || 0} نقطة</option>`).join('')}</select></div>
        <div class="input-group"><label>العدد</label><input type="number" id="awardQty" value="1" min="1"></div>
        <button type="submit" class="btn-primary">منح</button></form>`);
      $('#awardForm').addEventListener('submit', async e => {
        e.preventDefault();
        const studentId = $('#awardStudent').value;
        const badgeId = parseInt($('#awardBadge').value);
        const qty = parseInt($('#awardQty').value) || 1;
        const { data: badge } = await sb.from('badges').select('*').eq('id', badgeId).single();
        const { data: existing } = await sb.from('user_badges').select('*').eq('user_id', studentId).eq('badge_id', badgeId).maybeSingle();
        if(existing){ await sb.from('user_badges').update({ quantity: (existing.quantity || 0) + qty }).eq('id', existing.id); }
        else { await sb.from('user_badges').insert({ user_id: studentId, badge_id: badgeId, quantity: qty }); }

      const {data:projs}=await sb.from('projects').select('*').order('id',{ascending:false});
      const addBtn=staff?`<button class="btn btn-primary-solid" onclick="openProjectModal()">+ بروجيكت</button>`:'';
      const body=(!projs||!projs.length)?`<div class="empty-state"><div class="icon">🎯</div><p>لا توجد بروجيكتات</p></div>`:`<div class="grid">${projs.map(p=>`<div class="item-card"><div class="item-card-header"><span class="badge badge-primary">ترم ${escapeHtml(p.term)}</span></div><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.description||'')}</p>${p.deadline?`<div class="item-meta"><span class="badge badge-warning">⏰ ${formatDate(p.deadline)}</span></div>`:''}<div class="btn-group"><button class="btn btn-primary-solid btn-sm" onclick="submitProject(${p.id})">تسليم</button>${staff?`<button class="btn btn-outline btn-sm" onclick="viewProjectSubmissions(${p.id})">👁️</button><button class="btn btn-danger btn-sm" onclick="deleteProject(${p.id})">🗑️</button>`:''}</div></div>`).join('')}</div>`;
      area.innerHTML=`<div class="card"><div class="card-header"><h3 class="card-title">🎯 البروجيكت</h3>${addBtn}</div>${body}</div>`;
    }

    window.openProjectModal=function(){
      openModal(`<h2>🎯 بروجيكت جديد</h2><form id="projForm">
        <div class="input-group"><label>الترم</label><select id="projTerm"><option value="1">الأول</option><option value="2">الثاني</option></select></div>
        <div class="input-group"><label>العنوان</label><input type="text" id="projTitle" required/></div>
        <div class="input-group"><label>الوصف</label><textarea id="projDesc" rows="4"></textarea></div>
        <div class="input-group"><label>الموعد</label><input type="datetime-local" id="projDeadline"/></div>
        <button type="submit" class="btn-primary">إنشاء</button></form>`);
      $('#projForm').addEventListener('submit', async e=>{
        e.preventDefault();
        await sb.from('projects').insert({term:$('#projTerm').value,title:$('#projTitle').value.trim(),description:$('#projDesc').value.trim(),deadline:$('#projDeadline').value?new Date($('#projDeadline').value).toISOString():null,created_by:currentProfile.id});
        toast('✅','success'); closeModal(); renderProjects();
      });
    };

    window.submitProject=async function(id){
      const {data:ex}=await sb.from('project_submissions').select('*').eq('project_id',id).eq('user_id',currentProfile.id).maybeSingle();
      if(ex){toast('⚠️ سلّمت مسبقاً','warning');return;}
      openModal(`<h2>📤 تسليم</h2><form id="submitProjForm">
        <div class="input-group"><label>المحتوى</label><textarea id="projContent" rows="6" required></textarea></div>
        <div class="input-group"><label>روابط (اختياري)</label><textarea id="projFiles" rows="3"></textarea></div>
        <button type="submit" class="btn-primary">تسليم</button></form>`);
      $('#submitProjForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const files=$('#projFiles').value.split('\n').map(f=>f.trim()).filter(Boolean);
        await sb.from('project_submissions').insert({project_id:id,user_id:currentProfile.id,content:$('#projContent').value.trim(),files});
        toast('🎉 تم','success'); closeModal();
      });
    };

    window.viewProjectSubmissions=async function(id){
      const {data:subs} = await sb.from('project_submissions').select('*, profiles(full_name)').eq('project_id', id).order('submitted_at', {ascending: false});
      if(!subs || subs.length === 0) { toast('لا توجد تسليمات','warning'); return; }
      openModal(`<h2>📥 التسليمات</h2><div style="max-height:400px;overflow-y:auto">${subs.map(s => `<div class="announcement-card"><div class="announcement-header"><div class="announcement-title">👤 ${escapeHtml(s.profiles?.full_name || 'طالب')}</div><div class="announcement-date">${formatDate(s.submitted_at)}</div></div><div class="announcement-content">${escapeHtml(s.content)}</div></div>`).join('')}</div>`);
    };

    window.deleteProject=async function(id){ if(!confirm('حذف؟'))return; await sb.from('projects').delete().eq('id',id); toast('🗑️','success'); renderProjects(); };

    async function renderSupport(){
      const area=$('#contentArea'); const admin=currentProfile.role==='admin'; const teacher=currentProfile.role==='teacher';
      let q=sb.from('support_tickets').select('*, profiles(full_name)').order('created_at',{ascending:false});
      if(!admin && !teacher) q=q.eq('user_id',currentProfile.id);
      const {data:tickets}=await q;
      let html=`<div class="card"><div class="card-header"><h3 class="card-title">💬 رسالة جديدة</h3></div><form id="ticketForm">
        <div class="input-group"><label>النوع</label><select id="ticketType"><option value="support">دعم 🛠️</option><option value="suggestion">اقتراح 💡</option></select></div>
        <div class="input-group"><label>الموضوع</label><input type="text" id="ticketSubject" required/></div>
        <div class="input-group"><label>الرسالة</label><textarea id="ticketMessage" rows="4" required></textarea></div>
        <button type="submit" class="btn-primary">إرسال</button></form></div>`;
      if(tickets&&tickets.length){
        html+=`<div class="card"><div class="card-header"><h3 class="card-title">📋 الرسائل</h3></div>${tickets.map(t=>`<div class="announcement-card"><div class="announcement-header"><div class="announcement-title">${t.type==='suggestion'?'💡':'🛠️'} ${escapeHtml(t.subject)} ${admin||teacher?`<span class="badge badge-info" style="margin-right:8px">${escapeHtml(t.profiles?.full_name)}</span>`:''}</div><div class="announcement-date">${formatDate(t.created_at)}</div></div><div class="announcement-content">${escapeHtml(t.message)}</div>${t.response?`<div style="margin-top:10px;padding:10px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);border-radius:9px"><strong>✅ الرد:</strong> ${escapeHtml(t.response)}</div>`:''}${(admin||teacher)&&!t.response?`<button class="btn btn-primary-solid btn-sm" style="margin-top:10px" onclick="replyTicket(${t.id})">الرد</button>`:''}</div>`).join('')}</div>`;
      }
      area.innerHTML=html;
      $('#ticketForm').addEventListener('submit', async e=>{
        e.preventDefault();
        await sb.from('support_tickets').insert({user_id:currentProfile.id,type:$('#ticketType').value,subject:$('#ticketSubject').value.trim(),message:$('#ticketMessage').value.trim()});
        toast('✅','success'); renderSupport();
      });
    }

    window.replyTicket=async function(id){
      openModal(`<h2>💬 الرد</h2><form id="replyForm"><div class="input-group"><label>الرد</label><textarea id="replyText" rows="5" required></textarea></div><button type="submit" class="btn-primary">إرسال</button></form>`);
      $('#replyForm').addEventListener('submit', async e=>{
        e.preventDefault();
        await sb.from('support_tickets').update({response:$('#replyText').value.trim(),status:'closed'}).eq('id',id);
        toast('✅','success'); closeModal(); renderSupport();
      });
    };

    async function renderAdmin(){
      if(currentProfile.role!=='admin'){ $('#contentArea').innerHTML='<div class="empty-state"><div class="icon">🔒</div><p>غير مصرح</p></div>'; return; }
      const area=$('#contentArea');
      const [u]=await Promise.all([sb.from('profiles').select('*').order('created_at',{ascending:false})]);
      const users=u.data||[];
      area.innerHTML=`<div class="stats-grid">
        <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value">${users.filter(x=>x.role==='student').length}</div><div class="stat-label">الطلاب</div></div>
        <div class="stat-card"><div class="stat-icon">👨‍🏫</div><div class="stat-value">${users.filter(x=>x.role==='teacher').length}</div><div class="stat-label">المدرسون</div></div></div>
      <div class="card"><div class="card-header"><h3 class="card-title">⚙️ إدارة الحسابات</h3><button class="btn btn-primary-solid" onclick="openCreateAccountModal()">➕ إنشاء حساب</button></div>
      <div class="table-wrapper"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>النقاط</th><th>إجراءات</th></tr></thead><tbody>
        ${users.map(x=>`<tr><td>${escapeHtml(x.full_name)}</td><td style="font-size:12px">${escapeHtml(x.email)}</td>
          <td><span class="badge ${x.role==='admin'?'badge-danger':x.role==='teacher'?'badge-warning':'badge-primary'}">${x.role}</span></td>
          <td>${x.points||0}</td>
          <td><div class="btn-group">
            <button class="btn btn-sm btn-outline" onclick="editUserRole('${x.id}','${x.role}')">الدور</button>
            <button class="btn btn-sm btn-success" onclick="openStudentBadgesModal('${x.id}','${escapeHtml(x.full_name)}')">🎖️ الأوسمة</button>
            ${x.id!==currentProfile.id?`<button class="btn btn-sm btn-danger" onclick="deleteUser('${x.id}','${escapeHtml(x.full_name)}')">🗑️ حذف</button>`:''}
          </div></td></tr>`).join('')}
      </tbody></table></div></div>`;
    }

    window.openCreateAccountModal=function(){
      openModal(`<h2>➕ إنشاء حساب</h2><form id="accForm">
        <div class="input-group"><label>الاسم</label><input type="text" id="accName" required/></div>
        <div class="input-group"><label>البريد</label><input type="email" id="accEmail" required/></div>
        <div class="input-group"><label>كلمة المرور</label><input type="text" id="accPass" value="123456" minlength="6" required/></div>
        <div class="input-group"><label>النوع</label><select id="accRole"><option value="student">طالب</option><option value="teacher">مدرس</option><option value="admin">مدير</option></select></div>
        <button type="submit" class="btn-primary" id="accBtn">إنشاء</button></form>`);
      $('#accForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const btn=$('#accBtn'); btn.disabled=true; btn.innerHTML='<span class="loader"></span>';
        try{
          const temp = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
          const password = $('#accPass').value;
          const mustChange = (password === '123456');
          const { data, error } = await temp.auth.signUp({ email:$('#accEmail').value.trim().toLowerCase(), password:password, options:{ data:{ full_name:$('#accName').value.trim(), role:$('#accRole').value } } });
          if(error){ toast(/exists/i.test(error.message)?'❌ البريد مسجل':'❌ '+error.message,'error'); return; }
          if(data.user){
            await sb.from('profiles').update({ full_name:$('#accName').value.trim(), role:$('#accRole').value, must_change_password: mustChange }).eq('id', data.user.id);
            toast(mustChange ? '✅ تم (سيُطلب تغيير الباسورد)' : '✅ تم','success');
          }
          closeModal(); renderAdmin();
        }catch(ex){ toast('❌ '+ex.message,'error'); }
        finally{ btn.disabled=false; btn.innerHTML='إنشاء'; }
      });
    };

    window.editUserRole=async function(id,cur){ const r=prompt('الدور (student/teacher/admin):',cur); if(!r||!['student','teacher','admin'].includes(r))return; await sb.from('profiles').update({role:r}).eq('id',id); toast('✅','success'); renderAdmin(); };

    window.openStudentBadgesModal = async function(userId, userName){
      const [badgesRes, userBadgesRes] = await Promise.all([
        sb.from('badges').select('*').order('name'),
        sb.from('user_badges').select('*').eq('user_id', userId)
      ]);
      const badges = badgesRes.data || [];
      const userBadges = userBadgesRes.data || [];
      const userBadgesMap = {};
      userBadges.forEach(ub => userBadgesMap[ub.badge_id] = ub);

      openModal(`
        <h2>🎖️ أوسمة ${escapeHtml(userName)}</h2>
        <div style="max-height:400px;overflow-y:auto">
          ${badges.length === 0 ? '<div class="empty-state"><p>لا توجد أوسمة متاحة</p></div>' : badges.map(b => {
            const userBadge = userBadgesMap[b.id];
            const hasBadge = !!userBadge;
            const qty = userBadge?.quantity || 0;
            return `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)">
                <div style="display:flex;align-items:center;gap:12px">
                  <span style="font-size:28px">${escapeHtml(b.icon || '🏅')}</span>
                  <div>
                    <div style="font-weight:700">${escapeHtml(b.name)}</div>
                    <div style="font-size:11px;color:var(--muted)">⭐ ${b.points || 0} نقطة</div>
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  ${hasBadge ? `<span class="badge badge-success">✓ ${qty}</span>` : ''}
                  ${hasBadge ? `<button class="btn btn-danger btn-sm" onclick="removeBadgeFromStudent('${userId}', ${b.id})">🗑️</button>` : `<button class="btn btn-success btn-sm" onclick="addBadgeToStudent('${userId}', ${b.id})">➕</button>`}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `);
    };

    window.addBadgeToStudent = async function(userId, badgeId){
      const { data: existing } = await sb.from('user_badges').select('*').eq('user_id', userId).eq('badge_id', badgeId).maybeSingle();
      if(existing){
        await sb.from('user_badges').update({ quantity: (existing.quantity || 0) + 1 }).eq('id', existing.id);
      } else {
        await sb.from('user_badges').insert({ user_id: userId, badge_id: badgeId, quantity: 1 });
      }
      await recalculatePoints(userId);
      toast('✅ تم المنح', 'success');
      openStudentBadgesModal(userId, '');
    };

    window.removeBadgeFromStudent = async function(userId, badgeId){
      if(!confirm('حذف الوسام من الطالب؟')) return;
      const { data: existing } = await sb.from('user_badges').select('*').eq('user_id', userId).eq('badge_id', badgeId).maybeSingle();
      if(existing){
        if(existing.quantity > 1){
          await sb.from('user_badges').update({ quantity: existing.quantity - 1 }).eq('id', existing.id);
        } else {
          await sb.from('user_badges').delete().eq('id', existing.id);
        }
      }
      await recalculatePoints(userId);
      toast('🗑️ تم الحذف', 'success');
      openStudentBadgesModal(userId, '');
    };

    window.deleteUser = async function(userId, userName){
      if(!confirm(`حذف حساب ${userName} نهائياً؟`)) return;
      if(!confirm(`تأكيد نهائي: سيتم حذف ${userName} وجميع بياناته!`)) return;
      
      try {
        await sb.from('profiles').delete().eq('id', userId);
        toast('🗑️ تم حذف الحساب', 'success');
        renderAdmin();
      } catch(err) {
        toast('❌ ' + err.message, 'error');
      }
    };

    (async ()=>{
      try{ const { data:{ session } } = await sb.auth.getSession(); if(session) await loadUser(); }catch(e){ console.error(e); }
    })();
  </script>
</body>
</html>
