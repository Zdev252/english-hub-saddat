<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة السادات | English Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b15; --bg2: #0b1120;
      --surface: rgba(255,255,255,.04); --surface2: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.09); --border2: rgba(255,255,255,.16);
      --text: #e8ecf6; --muted: #8b93a8;
      --primary: #8b5cf6; --primary2: #6366f1; --accent: #22d3ee;
      --success: #34d399; --warning: #fbbf24; --danger: #f87171;
      --grad: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #22d3ee 100%);
      --glow: 0 0 25px rgba(139,92,246,.35);
      --shadow: 0 8px 30px rgba(0,0,0,.45);
      --r: 14px; --r-lg: 22px; --side: 270px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: #2a3350; border-radius: 10px; }
    .muted { color: var(--muted); font-size: 11px; }
    .gradient-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .bg-glow { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; opacity: .5; }
    .glow-1 { width: 520px; height: 520px; background: rgba(139,92,246,.22); top: -160px; right: -120px; animation: drift 14s ease-in-out infinite; }
    .glow-2 { width: 460px; height: 460px; background: rgba(34,211,238,.14); bottom: -160px; left: -120px; animation: drift 18s ease-in-out infinite reverse; }
    @keyframes drift { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(40px, -40px); } }
    .screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
    .screen.active { display: block; }
    #loginScreen.active { display: flex; align-items: center; justify-content: center; padding: 20px; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 44px 44px; }
    .login-container { background: rgba(13,18,35,.75); backdrop-filter: blur(24px); border: 1px solid var(--border2); border-radius: var(--r-lg); padding: 42px 36px; width: 100%; max-width: 440px; box-shadow: var(--shadow); animation: up .5s ease; }
    @keyframes up { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .login-header { text-align: center; margin-bottom: 28px; }
    .logo-circle { width: 86px; height: 86px; background: var(--grad); border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 42px; margin: 0 auto 16px; box-shadow: var(--glow); }
    .login-header h1 { font-size: 30px; font-weight: 900; }
    .school-name { font-weight: 800; margin-top: 6px; font-size: 15px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .login-note { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--border2); padding: 10px; border-radius: 10px; }
    .form { display: none; }
    .form.active { display: block; animation: fade .3s; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; color: #c3cadd; }
    .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px 15px; background: rgba(255,255,255,.05); border: 1.5px solid var(--border); border-radius: 11px; color: var(--text); font-family: inherit; font-size: 15px; transition: .25s; min-height: 48px; }
    .input-group input:focus, .input-group select:focus, .input-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139,92,246,.18); background: rgba(139,92,246,.06); }
    .input-group select option { background: var(--bg2); color: var(--text); }
    .btn-primary { width: 100%; padding: 14px; background: var(--grad); color: #fff; border: none; border-radius: 11px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; transition: .25s; box-shadow: 0 6px 22px rgba(99,102,241,.35); min-height: 48px; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(139,92,246,.5); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center; min-height: 20px; font-weight: 600; }
    #appScreen.active { display: flex; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); z-index: 90; }
    .overlay.show { display: block; }
    .sidebar { width: var(--side); background: rgba(10,14,28,.95); backdrop-filter: blur(20px); border-left: 1px solid var(--border); height: 100vh; position: fixed; right: 0; top: 0; display: flex; flex-direction: column; transition: transform .3s; z-index: 100; }
    .sidebar-header { padding: 22px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
    .logo-small { width: 46px; height: 46px; background: var(--grad); border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .sidebar-header h2 { font-size: 17px; font-weight: 900; }
    .sidebar-nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 11px; color: #aab2c8; cursor: pointer; transition: .2s; margin-bottom: 4px; font-weight: 700; font-size: 14px; border: 1px solid transparent; }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: linear-gradient(135deg, rgba(139,92,246,.25), rgba(34,211,238,.12)); color: #fff; border-color: rgba(139,92,246,.45); }
    .nav-item .icon { font-size: 20px; }
    .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
    .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .user-avatar { width: 44px; height: 44px; background: var(--grad); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }
    .user-name { font-weight: 800; font-size: 14px; }
    .user-role { font-size: 12px; color: var(--accent); font-weight: 700; }
    .btn-ghost, .btn-logout { width: 100%; padding: 10px; border-radius: 9px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; transition: .2s; margin-bottom: 8px; min-height: 44px; border: 1px solid; }
    .btn-ghost { background: var(--surface); border-color: var(--border); color: #aab2c8; }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-logout { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.3); color: var(--danger); }
    .btn-logout:hover { background: rgba(248,113,113,.2); }
    .main-content { flex: 1; margin-right: var(--side); min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { background: rgba(10,14,28,.85); backdrop-filter: blur(16px); padding: 14px 24px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .menu-toggle { display: none; background: none; border: none; font-size: 26px; cursor: pointer; color: var(--text); }
    .page-title { font-size: 19px; font-weight: 900; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .points-badge { background: var(--grad); color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: 900; display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; }
    .content-area { padding: 24px; flex: 1; }
    .stats-grid, .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-bottom: 24px; }
    .stat-card, .card, .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; transition: .3s; }
    .stat-card:hover, .item-card:hover { transform: translateY(-4px); border-color: rgba(139,92,246,.5); box-shadow: 0 12px 35px rgba(0,0,0,.5); }
    .stat-icon { width: 48px; height: 48px; background: var(--grad); border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 23px; margin-bottom: 12px; }
    .stat-value { font-size: 28px; font-weight: 900; }
    .stat-label { color: var(--muted); font-size: 13px; font-weight: 700; }
    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .card-title { font-size: 17px; font-weight: 900; }
    .item-card h3 { font-size: 15.5px; font-weight: 800; margin-bottom: 6px; }
    .item-card p { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 12px; }
    .item-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .badge { padding: 4px 11px; border-radius: 20px; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; border: 1px solid; }
    .badge-primary { background: rgba(139,92,246,.14); color: #c4b5fd; border-color: rgba(139,92,246,.35); }
    .badge-success { background: rgba(52,211,153,.12); color: #6ee7b7; border-color: rgba(52,211,153,.35); }
    .badge-warning { background: rgba(251,191,36,.12); color: #fcd34d; border-color: rgba(251,191,36,.35); }
    .badge-danger { background: rgba(248,113,113,.12); color: #fca5a5; border-color: rgba(248,113,113,.35); }
    .badge-info { background: rgba(34,211,238,.12); color: #67e8f9; border-color: rgba(34,211,238,.35); }
    .btn { padding: 8px 16px; border: none; border-radius: 9px; font-family: inherit; font-weight: 800; font-size: 13px; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; text-decoration: none; }
    .btn-sm { padding: 6px 12px; font-size: 12px; min-height: 36px; }
    .btn-primary-solid { background: var(--grad); color: #fff; }
    .btn-primary-solid:hover { transform: translateY(-2px); }
    .btn-success { background: rgba(52,211,153,.15); color: #6ee7b7; border: 1px solid rgba(52,211,153,.4); }
    .btn-danger { background: rgba(248,113,113,.13); color: #fca5a5; border: 1px solid rgba(248,113,113,.4); }
    .btn-warning { background: rgba(251,191,36,.13); color: #fcd34d; border: 1px solid rgba(251,191,36,.4); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border2); color: #aab2c8; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
    .leaderboard-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; }
    .leaderboard-item.top-1 { background: linear-gradient(135deg, rgba(251,191,36,.16), rgba(251,191,36,.04)); border-color: rgba(251,191,36,.5); }
    .rank { width: 42px; height: 42px; background: var(--grad); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }
    .leaderboard-info { flex: 1; min-width: 0; }
    .leaderboard-name { font-weight: 800; font-size: 14px; }
    .leaderboard-points { font-weight: 900; color: var(--accent); font-size: 17px; flex-shrink: 0; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(3,6,14,.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 18px; }
    .modal.active { display: flex; }
    .modal-content { background: #0d1326; border: 1px solid var(--border2); border-radius: var(--r-lg); max-width: 620px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; animation: up .3s; }
    .modal-close { position: absolute; top: 14px; left: 14px; width: 36px; height: 36px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; }
    .modal-body { padding: 30px; }
    .toast-container { position: fixed; top: 18px; left: 18px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: #0d1326; border: 1px solid var(--border2); padding: 14px 18px; border-radius: 11px; box-shadow: var(--shadow); min-width: 270px; border-right: 4px solid var(--primary); animation: slideIn .3s; font-weight: 700; font-size: 13.5px; pointer-events: auto; }
    .toast.success { border-right-color: var(--success); }
    .toast.error { border-right-color: var(--danger); }
    @keyframes slideIn { from { transform: translateX(-110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .quiz-question { background: var(--surface); border: 1px solid var(--border); padding: 18px; border-radius: var(--r); margin-bottom: 14px; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .quiz-option { padding: 12px 15px; background: rgba(255,255,255,.04); border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; text-align: right; color: var(--text); min-height: 44px; display: flex; align-items: center; }
    .quiz-option.selected { border-color: var(--primary); background: rgba(139,92,246,.16); }
    .quiz-option.correct { border-color: var(--success); background: rgba(52,211,153,.14); }
    .quiz-option.wrong { border-color: var(--danger); background: rgba(248,113,113,.13); }
    .quiz-explanation { background: rgba(34,211,238,.09); border: 1px solid rgba(34,211,238,.3); padding: 11px; border-radius: 9px; margin-top: 10px; font-size: 12.5px; color: #a5f3fc; display: none; }
    .quiz-explanation.show { display: block; }
    .announcement-card { background: var(--surface); border: 1px solid var(--border); border-right: 4px solid var(--primary); border-radius: var(--r); padding: 18px; margin-bottom: 13px; }
    .announcement-card.urgent { border-right-color: var(--danger); }
    .announcement-header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .announcement-title { font-weight: 800; font-size: 15px; }
    .announcement-date { color: var(--muted); font-size: 11.5px; }
    .announcement-content { color: #b8c0d4; line-height: 1.8; font-size: 13.5px; }
    .loader { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.25); border-radius: 50%; border-top-color: #fff; animation: spin .8s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 56px; margin-bottom: 14px; opacity: .5; }
    .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { padding: 12px 14px; text-align: right; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { background: rgba(255,255,255,.04); font-weight: 800; color: #aab2c8; font-size: 12px; white-space: nowrap; }
    .dynamic-q-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed var(--border); }
    .remove-q-btn { background: rgba(248,113,113,0.2); color: #fca5a5; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 10px; }
    .badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .badge-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: var(--r); text-align: center; transition: .3s; position: relative; overflow: hidden; }
    .badge-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(139,92,246,.1) 0%, transparent 70%); opacity: 0; transition: .3s; }
    .badge-card:hover::before { opacity: 1; }
    .badge-card:hover { transform: translateY(-5px) scale(1.02); border-color: rgba(139,92,246,.5); box-shadow: 0 12px 35px rgba(139,92,246,.2); }
    .badge-card.earned { background: linear-gradient(135deg, rgba(139,92,246,.2), rgba(34,211,238,.1)); border-color: rgba(139,92,246,.6); box-shadow: 0 0 25px rgba(139,92,246,.15); }
    .badge-icon { font-size: 42px; margin-bottom: 10px; filter: drop-shadow(0 4px 8px rgba(139,92,246,.3)); }
    .badge-name { font-weight: 800; font-size: 14px; margin-bottom: 4px; }
    .badge-points { font-size: 12px; color: var(--muted); }
    .badge-qty { background: var(--grad); color: #fff; padding: 3px 12px; border-radius: 12px; font-size: 12px; font-weight: 900; display: inline-block; margin-top: 8px; box-shadow: 0 2px 8px rgba(139,92,246,.3); }
    .footer { text-align: center; padding: 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }
    
    /* Support Tickets - Professional */
    .ticket-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; margin-bottom: 14px; transition: .3s; border-right: 4px solid var(--primary); }
    .ticket-card:hover { transform: translateX(-4px); border-color: var(--border2); }
    .ticket-card.status-open { border-right-color: var(--warning); }
    .ticket-card.status-closed { border-right-color: var(--success); opacity: .85; }
    .ticket-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .ticket-subject { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; flex: 1; }
    .ticket-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
    .ticket-body { color: #b8c0d4; line-height: 1.8; font-size: 13.5px; padding: 12px; background: rgba(255,255,255,.02); border-radius: 8px; margin-bottom: 10px; }
    .ticket-reply { background: rgba(52,211,153,.08); border: 1px solid rgba(52,211,153,.25); padding: 12px; border-radius: 8px; margin-top: 10px; }
    .ticket-reply strong { color: var(--success); }
    .ticket-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    
    @media (max-width: 900px) {
      .sidebar { transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-right: 0; }
      .menu-toggle { display: block; }
      .content-area { padding: 16px; }
      .stats-grid, .grid, .badges-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      table { min-width: 600px; }
    }
    @media (max-width: 600px) {
      .login-container { padding: 30px 20px; }
      .stats-grid, .grid, .badges-grid { grid-template-columns: 1fr; }
      .btn-group { flex-direction: column; }
      .btn-group .btn { width: 100%; }
      .modal-content { width: 95%; max-height: 95vh; border-radius: 16px; }
      .modal-body { padding: 20px 16px; }
      .modal-body h2 { font-size: 16px; }
      .topbar { padding: 12px 16px; gap: 10px; }
      .page-title { font-size: 16px; }
      .points-badge { padding: 6px 12px; font-size: 13px; }
      .table-wrapper { margin: -10px; border-radius: 0; border-left: none; border-right: none; }
      table { min-width: 100%; font-size: 11px; }
      th, td { padding: 8px 6px; font-size: 11px; }
      td .btn-group { flex-direction: column; gap: 4px; }
      td .btn { padding: 4px 8px; font-size: 10px; min-height: 28px; width: 100%; }
      .input-group { margin-bottom: 12px; }
      .input-group label { font-size: 12px; }
      .input-group input, .input-group select, .input-group textarea { font-size: 14px; padding: 10px 12px; min-height: 44px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <div id="loginScreen" class="screen active">
    <div class="login-container">
      <div class="login-header">
        <div class="logo-circle"><span>🎓</span></div>
        <h1 class="gradient-text">English Hub</h1>
        <p class="school-name">مدرسة السادات الثانوية بنين</p>
        <p class="subtitle">المحلة الكبرى</p>
      </div>
      <form id="loginForm" class="form active">
        <div class="input-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" required placeholder="example@sadat.edu" />
        </div>
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button type="submit" id="loginBtn" class="btn-primary">دخول 🚀</button>
        <p id="loginError" class="error-msg"></p>
      </form>
      <div class="login-note">🔐 الحسابات يتم إنشاؤها بواسطة الإدارة فقط</div>
    </div>
  </div>

  <div id="appScreen" class="screen">
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-small">🎓</div>
        <div>
          <h2 class="gradient-text">English Hub</h2>
          <small class="muted">السادات الثانوية بنين</small>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">?</div>
          <div class="user-details">
            <div class="user-name" id="userName">...</div>
            <div class="user-role" id="userRole">...</div>
          </div>
        </div>

    async function showAwardModal(badgeId, badgeName, badgePoints){
      const { data: students } = await sb.from('profiles').select('*').eq('role','student').order('full_name');
      
      if(!students || !students.length){
        toast('⚠️ لا يوجد طلاب', 'warning');

      window.awardBadgePoints = badgePoints;
      
      openModal(`
        <h2>🎁 منح وسام</h2>
        <div style="text-align:center;margin-bottom:24px;padding:20px;background:linear-gradient(135deg, rgba(139,92,246,.15), rgba(34,211,238,.08));border-radius:12px;border:1px solid rgba(139,92,246,.3)">

        </div>
        
        <form id="awardForm">
          <div class="input-group">
            <label>اختر الطالب</label>
            <select id="awardStudentId" required>
              <option value="">-- اختر طالب --</option>
              ${students.map(s => `<option value="${s.id}">${escapeHtml(s.full_name)}</option>`).join('')}
            </select>
          </div>
          
          <div class="input-group">
            <label>عدد الأوسمة</label>

                   style="font-size:24px;text-align:center;font-weight:900"/>
          </div>
          
          <div style="background:rgba(34,211,238,.1);border:2px solid rgba(34,211,238,.3);padding:16px;border-radius:12px;margin-bottom:20px;text-align:center">
            <div style="color:var(--muted);font-size:13px;margin-bottom:6px">إجمالي النقاط الممنوحة</div>
            <div style="font-size:32px;font-weight:900;color:var(--accent)" id="awardTotalPoints">${badgePoints}</div>
            <div style="color:var(--muted);font-size:12px;margin-top:4px">نقطة</div>

          <button type="submit" class="btn-primary" style="font-size:16px">🎁 منح الوسام الآن</button>
        </form>
      `);
      
      $('#awardQuantity').addEventListener('input', () => {
        const qty = parseInt($('#awardQuantity').value) || 1;
        const total = (window.awardBadgePoints || 0) * qty;
        $('#awardTotalPoints').textContent = total;
      });
      
      $('#awardForm').addEventListener('submit', async e => {
        e.preventDefault();
        
        const badgeId = window.awardBadgeId;
        const studentId = $('#awardStudentId').value;
        const quantity = parseInt($('#awardQuantity').value) || 1;
        
        if(!studentId){
          toast('⚠️ اختر طالب', 'warning');
          return;
        }
        
        const { data: existing } = await sb.from('user_badges')
          .select('*')
          .eq('user_id', studentId)
          .eq('badge_id', badgeId)
          .maybeSingle();
        
        if(existing){
          const { error } = await sb.from('user_badges')
            .update({ quantity: (existing.quantity || 0) + quantity })
            .eq('id', existing.id);
          
          if(error){
            toast('❌ ' + error.message, 'error');
            return;
          }
        } else {
          const { error } = await sb.from('user_badges')
            .insert({ user_id: studentId, badge_id: badgeId, quantity: quantity });
          
          if(error){
            toast('❌ ' + error.message, 'error');
            return;
          }
        }
        
        await recalculatePoints(studentId);
        
        toast(`✅ تم منح ${quantity} وسام بنجاح!`, 'success');
        closeModal();
      });
    }

    function lessonCard(l,admin){
      const now = new Date();
      const start = l.start_time ? new Date(l.start_time) : null;
      const end = l.end_time ? new Date(l.end_time) : null;
      let statusClass = 'badge-info', statusText = 'قادمة';
      if(start && now >= start && (!end || now <= end)){ statusClass = 'badge-danger'; statusText = 'مباشر 🔴'; }
      else if(end && now > end){ statusClass = 'badge-success'; statusText = 'انتهت'; }
      return `<div class="item-card"><div class="item-card-header"><span class="badge ${statusClass}">${statusText}</span></div>
        <h3>${escapeHtml(l.title)}</h3><p>${escapeHtml(l.description||'')}</p>
        <div class="item-meta"><span class="badge badge-info">🕐 ${l.start_time?formatDate(l.start_time):'غير محدد'}</span></div>
        ${l.lesson_link ? `<a href="${escapeHtml(l.lesson_link)}" target="_blank" class="btn btn-success btn-sm" style="margin-bottom:10px; width:100%">🔗 دخول الحصة</a>` : ''}
        <div class="btn-group">${admin
          ?`<button class="btn btn-sm btn-outline" onclick="openAttendanceModal(${l.id})">📋</button><button class="btn btn-sm btn-warning" onclick="openLessonModal(${l.id})">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteLesson(${l.id})">🗑️</button>`
          :`<button class="btn btn-sm btn-success" onclick="markAttendance(${l.id},'present')">✅</button><button class="btn btn-sm btn-danger" onclick="markAttendance(${l.id},'absent')">❌</button>`}</div></div>`;
    }

      openModal(`<h2>📖 إضافة مادة</h2><form id="materialForm">
        <div class="input-group"><label>العنوان</label><input type="text" id="matTitle" required/></div>
        <div class="input-group"><label>الوصف</label><textarea id="matDesc" rows="2"></textarea></div>

    window.saveQField = function(qIdx, field, value){

    window.saveQOption = function(qIdx, optIdx, value){
      currentQuestions[qIdx].options[optIdx] = value;
    };

      currentQuestions[qIdx].type = newType;
      if(newType === 'tf') { currentQuestions[qIdx].options = ['صح ✅', 'خطأ ❌']; currentQuestions[qIdx].correct = 0; }

    function renderQuestionsUI(){
      const container = $('#questionsContainer');
      if(!container) return;
      container.innerHTML = currentQuestions.map((q, i) => `
        <div class="dynamic-q-box">
          <div style="display:flex;justify-content:space-between;margin-bottom:10px"><strong>سؤال ${i+1}</strong><button type="button" class="remove-q-btn" onclick="removeQuestionUI(${i})">حذف</button></div>
          <div class="input-group"><label>النص</label><input type="text" value="${escapeHtml(q.q)}" oninput="saveQField(${i},'q',this.value)" placeholder="اكتب السؤال..."/></div>
          <div class="input-group"><label>النوع</label><select onchange="changeQType(${i},this.value)"><option value="mc" ${q.type==='mc'?'selected':''}>اختيار</option><option value="tf" ${q.type==='tf'?'selected':''}>صح/خطأ</option></select></div>
          <div class="quiz-options" style="margin-bottom:10px">${q.options.map((opt, j) => `<div style="display:flex;align-items:center;gap:8px">
            <input type="radio" name="correct_${i}" ${q.correct==j?'checked':''} onchange="setCorrectAnswer(${i},${j})" style="width:20px;height:20px">
            ${q.type==='tf' ? `<span style="flex:1;font-weight:700">${opt}</span>` : `<input type="text" value="${escapeHtml(opt)}" oninput="saveQOption(${i},${j},this.value)" placeholder="الخيار ${j+1}" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text)">`}
          </div>`).join('')}</div>
          <div class="input-group"><label>التفسير</label><input type="text" value="${escapeHtml(q.explanation)}" oninput="saveQField(${i},'explanation',this.value)" placeholder="لماذا هذه الإجابة صحيحة؟"/></div>
        </div>
      `).join('');
    }

    window.startAssignment=async function(id){
      const {data:a}=await sb.from('assignments').select('*').eq('id',id).single();

      if(ex){toast(`⚠️ درجاتك: ${ex.score}`,'warning');return;}
      const qs=a.questions||[];
      let html=`<h2>${escapeHtml(a.title)}</h2><form id="quizForm">`;
      qs.forEach((q,i)=>{html+=`<div class="quiz-question"><h4>س${i+1}: ${escapeHtml(q.q)}</h4><div class="quiz-options">${(q.options||[]).map((o,j)=>`<button type="button" class="quiz-option" data-q="${i}" data-opt="${j}" onclick="pickOption(this)">${escapeHtml(o)}</button>`).join('')}</div><div class="quiz-explanation" id="exp-${i}"></div></div>`;});

          const ans=sel?parseInt(sel.dataset.opt):-1; answers.push(ans);
          document.querySelectorAll(`.quiz-option[data-q="${i}"]`).forEach((o,j)=>{ if(j===q.correct)o.classList.add('correct'); else if(j===ans)o.classList.add('wrong'); });

          if(q.explanation){const el=$(`#exp-${i}`);el.textContent='💡 '+q.explanation;el.classList.add('show');}
        });
        await sb.from('submissions').insert({assignment_id:id,user_id:currentProfile.id,answers,score});

        toast(`🎉 ${score}/${qs.length} (${percent.toFixed(0)}%)`,'success');

          await checkAndAwardAutoBadges(currentProfile.id, 'assignment_pass');

    window.startExam=async function(id){
      const {data:exam}=await sb.from('exams').select('*').eq('id',id).single();
      const {data:ex}=await sb.from('exam_attempts').select('*').eq('exam_id',id).eq('user_id',currentProfile.id).maybeSingle();
      if(ex){toast(`⚠️ درجاتك: ${ex.score}`,'warning');return;}
      const qs=exam.questions||[]; const dur=(exam.duration_minutes||30)*60*1000; const t0=Date.now();
      let html=`<h2>${escapeHtml(exam.title)}</h2><div style="background:var(--grad);color:#fff;padding:10px;border-radius:11px;text-align:center;margin-bottom:18px;font-weight:900">⏱️ <span id="examTimer">${exam.duration_minutes||30}:00</span></div><form id="examRunForm">`;
      qs.forEach((q,i)=>{html+=`<div class="quiz-question"><h4>س${i+1}: ${escapeHtml(q.q)}</h4><div class="quiz-options">${(q.options||[]).map((o,j)=>`<button type="button" class="quiz-option" data-q="${i}" data-opt="${j}" onclick="pickOption(this)">${escapeHtml(o)}</button>`).join('')}</div></div>`;});
      html+=`<button type="submit" class="btn-primary">تسليم</button></form>`;
      openModal(html);
      const timer=setInterval(()=>{
        const rem=Math.max(0,dur-(Date.now()-t0));
        const el=$('#examTimer'); if(!el){clearInterval(timer);return;}
        el.textContent=`${Math.floor(rem/60000)}:${String(Math.floor(rem%60000/1000)).padStart(2,'0')}`;
        if(rem<=0){clearInterval(timer);$('#examRunForm')?.requestSubmit();}
      },1000);
      $('#examRunForm').addEventListener('submit', async e=>{
        e.preventDefault(); if($('#examRunForm').dataset.done)return; $('#examRunForm').dataset.done='1'; clearInterval(timer);
        const answers=[]; let score=0;
        qs.forEach((q,i)=>{ const sel=document.querySelector(`.quiz-option[data-q="${i}"].selected`); const ans=sel?parseInt(sel.dataset.opt):-1; answers.push(ans); if(ans===q.correct)score++; });
        await sb.from('exam_attempts').insert({exam_id:id,user_id:currentProfile.id,answers,score,finished_at:new Date().toISOString()});
        toast(`🎉 ${score}/${qs.length}`,'success');
        await checkAndAwardAutoBadges(currentProfile.id, 'exam_complete');
        closeModal(); renderExams();
      });
    };

    window.deleteProjectFile = async function(fileUrl, submissionId, projectId){
      if(!confirm('حذف الملف من السيرفر؟')) return;
      try {
        // Extract path from URL
        const urlObj = new URL(fileUrl);
        const pathParts = urlObj.pathname.split('/storage/v1/object/public/materials/');
        if(pathParts.length > 1){
          const filePath = pathParts[1];
          await sb.storage.from('materials').remove([filePath]);
        }
        // Update submission files array
        const { data: sub } = await sb.from('project_submissions').select('files').eq('id', submissionId).single();
        const newFiles = (sub.files || []).filter(f => f !== fileUrl);
        await sb.from('project_submissions').update({ files: newFiles }).eq('id', submissionId);
        toast('🗑️ تم حذف الملف','success');
        viewProjectSubmissions(projectId);
      } catch(err) {
        toast('❌ '+err.message,'error');

        </div>`;
      } else {
        html += `<div class="card"><div class="empty-state"><div class="icon">💬</div><p>${admin ? 'لا توجد رسائل' : 'لم ترسل أي رسائل بعد'}</p></div></div>`;
      }
      
      area.innerHTML = html;
      
      if(!admin){
        $('#ticketForm').addEventListener('submit', async e=>{
          e.preventDefault();
          await sb.from('support_tickets').insert({user_id:currentProfile.id,type:$('#ticketType').value,subject:$('#ticketSubject').value.trim(),message:$('#ticketMessage').value.trim()});
          toast('✅ تم الإرسال','success'); renderSupport();
        });
      }
    }
    window.replyTicket=async function(id){
      openModal(`<h2>💬 الرد على الرسالة</h2><form id="replyForm">
        <div class="input-group"><label>الرد</label><textarea id="replyText" rows="5" required placeholder="اكتب ردك هنا..."></textarea></div>
        <button type="submit" class="btn-primary">📤 إرسال الرد</button></form>`);
      $('#replyForm').addEventListener('submit', async e=>{
        e.preventDefault();
        await sb.from('support_tickets').update({response:$('#replyText').value.trim(),status:'closed',updated_at:new Date().toISOString()}).eq('id',id);
        toast('✅ تم الرد','success'); closeModal(); renderSupport();
      });
    };
    window.deleteTicket = async function(id){
      if(!confirm('حذف الرسالة نهائياً من السيرفر؟')) return;
      await sb.from('support_tickets').delete().eq('id', id);
      toast('🗑️ تم الحذف','success'); renderSupport();
    };

    // ========== ADMIN ==========
    async function renderAdmin(){
      if(!isAdmin()){ $('#contentArea').innerHTML='<div class="empty-state"><div class="icon">🔒</div><p>غير مصرح</p></div>'; return; }
      const area=$('#contentArea');
      const [u]=await Promise.all([sb.from('profiles').select('*').order('created_at',{ascending:false})]);
      const users=u.data||[];
      area.innerHTML=`<div class="stats-grid">
        <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value">${users.filter(x=>x.role==='student').length}</div><div class="stat-label">الطلاب</div></div>
        <div class="stat-card"><div class="stat-icon">👨‍💼</div><div class="stat-value">${users.filter(x=>x.role==='admin').length}</div><div class="stat-label">الإدارة</div></div></div>
      <div class="card"><div class="card-header"><h3 class="card-title">⚙️ إدارة الحسابات</h3><button class="btn btn-primary-solid" onclick="openCreateAccountModal()">➕ إنشاء حساب</button></div>
      <div class="table-wrapper"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>النقاط</th><th>إجراءات</th></tr></thead><tbody>
        ${users.map(x=>`<tr><td>${escapeHtml(x.full_name)}</td><td style="font-size:12px">${escapeHtml(x.email)}</td>
          <td><span class="badge ${x.role==='admin'?'badge-danger':'badge-primary'}">${x.role==='admin'?'إدارة':'طالب'}</span></td>
          <td>${x.points||0}</td>
          <td><div class="btn-group">
            <button class="btn btn-sm btn-outline" onclick="editUserRole('${x.id}','${x.role}')">الدور</button>
            <button class="btn btn-sm btn-success" onclick="openStudentBadgesModal('${x.id}','${escapeHtml(x.full_name)}')">🎖️</button>
            ${x.id!==currentProfile.id?`<button class="btn btn-sm btn-danger" onclick="deleteUser('${x.id}','${escapeHtml(x.full_name)}')">🗑️</button>`:''}
          </div></td></tr>`).join('')}
      </tbody></table></div></div>`;
    }
    window.openCreateAccountModal=function(){
      openModal(`<h2>➕ إنشاء حساب</h2><form id="accForm">
        <div class="input-group"><label>الاسم</label><input type="text" id="accName" required/></div>
        <div class="input-group"><label>البريد</label><input type="email" id="accEmail" required/></div>
        <div class="input-group"><label>كلمة المرور</label><input type="text" id="accPass" value="123456" minlength="6" required/></div>
        <div class="input-group"><label>النوع</label><select id="accRole"><option value="student">طالب</option><option value="admin">إدارة</option></select></div>
        <button type="submit" class="btn-primary" id="accBtn">إنشاء</button></form>`);
      $('#accForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const btn=$('#accBtn'); btn.disabled=true; btn.innerHTML='<span class="loader"></span>';
        try{
          const temp = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
          const password = $('#accPass').value;
          const mustChange = (password === '123456');
          const { data, error } = await temp.auth.signUp({ email:$('#accEmail').value.trim().toLowerCase(), password:password, options:{ data:{ full_name:$('#accName').value.trim(), role:$('#accRole').value } } });
          if(error){ toast(/exists/i.test(error.message)?'❌ البريد مسجل':'❌ '+error.message,'error'); return; }
          if(data.user){
            await sb.from('profiles').update({ full_name:$('#accName').value.trim(), role:$('#accRole').value, must_change_password: mustChange }).eq('id', data.user.id);
            toast(mustChange ? '✅ تم (سيُطلب تغيير الباسورد)' : '✅ تم','success');
          }
          closeModal(); renderAdmin();
        }catch(ex){ toast('❌ '+ex.message,'error'); }
        finally{ btn.disabled=false; btn.innerHTML='إنشاء'; }
      });
    };
    window.editUserRole=async function(id,cur){ const r=prompt('الدور (student/admin):',cur); if(!r||!['student','admin'].includes(r))return; await sb.from('profiles').update({role:r}).eq('id',id); toast('✅','success'); renderAdmin(); };

    window.openStudentBadgesModal = async function(userId, userName){
      currentStudentIdForBadges = userId;
      currentStudentNameForBadges = userName;
      const [badgesRes, userBadgesRes] = await Promise.all([
        sb.from('badges').select('*').order('name'),
        sb.from('user_badges').select('*').eq('user_id', userId)
      ]);
      const badges = badgesRes.data || [];
      const userBadges = userBadgesRes.data || [];
      const userBadgesMap = {};
      userBadges.forEach(ub => userBadgesMap[ub.badge_id] = ub);

      openModal(`
        <h2>🎖️ أوسمة ${escapeHtml(userName)}</h2>
        <div style="max-height:400px;overflow-y:auto">
          ${badges.length === 0 ? '<div class="empty-state"><p>لا توجد أوسمة</p></div>' : badges.map(b => {
            const userBadge = userBadgesMap[b.id];
            const hasBadge = !!userBadge;
            const qty = userBadge?.quantity || 0;
            return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)">
              <div style="display:flex;align-items:center;gap:12px">
                <span style="font-size:28px">${escapeHtml(b.icon || '🏅')}</span>
                <div>
                  <div style="font-weight:700">${escapeHtml(b.name)}</div>
                  <div style="font-size:11px;color:var(--muted)">⭐ ${b.points || 0} نقطة</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                ${hasBadge ? `<span class="badge badge-success">✓ ${qty}</span>` : ''}
                ${hasBadge ? `<button class="btn btn-danger btn-sm" onclick="removeBadgeFromStudent('${userId}', ${b.id})">🗑️</button>` : `<button class="btn btn-success btn-sm" onclick="addBadgeToStudent('${userId}', ${b.id})">➕</button>`}
              </div>
            </div>`;
          }).join('')}
        </div>
      `);
    };

    window.addBadgeToStudent = async function(userId, badgeId){
      const { data: existing } = await sb.from('user_badges').select('*').eq('user_id', userId).eq('badge_id', badgeId).maybeSingle();
      if(existing){
        await sb.from('user_badges').update({ quantity: (existing.quantity || 0) + 1 }).eq('id', existing.id);
      } else {
        await sb.from('user_badges').insert({ user_id: userId, badge_id: badgeId, quantity: 1 });
      }
      await recalculatePoints(userId);
      toast('✅ تم المنح', 'success');
      // Refresh modal
      openStudentBadgesModal(userId, currentStudentNameForBadges);
    };

    window.removeBadgeFromStudent = async function(userId, badgeId){
      if(!confirm('حذف الوسام من الطالب؟')) return;
      const { data: existing } = await sb.from('user_badges').select('*').eq('user_id', userId).eq('badge_id', badgeId).maybeSingle();
      if(existing){
        if(existing.quantity > 1){
          await sb.from('user_badges').update({ quantity: existing.quantity - 1 }).eq('id', existing.id);
        } else {
          await sb.from('user_badges').delete().eq('id', existing.id);
        }
      }
      await recalculatePoints(userId);
      toast('🗑️ تم الحذف', 'success');
      openStudentBadgesModal(userId, currentStudentNameForBadges);
    };

    window.deleteUser = async function(userId, userName){
      if(!confirm(`حذف حساب ${userName} نهائياً؟`)) return;
      if(!confirm(`تأكيد نهائي: سيتم حذف ${userName} وجميع بياناته!`)) return;
      try {
        // Use the SQL function to delete from both tables
        const { error } = await sb.rpc('delete_user_account', { target_user_id: userId });
        if(error) throw error;
        toast('🗑️ تم حذف الحساب نهائياً', 'success');
        renderAdmin();
      } catch(err) {
        toast('❌ ' + err.message, 'error');
      }
    };

    (async ()=>{
      try{ const { data:{ session } } = await sb.auth.getSession(); if(session) await loadUser(); }catch(e){ console.error(e); }
    })();
  </script>
</body>
</html>
